[build]
  publish = "."

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Scheduling lives in Supabase pg_cron (migrations/009-pg-cron-schedules.sql).
# pg_net fires async HTTP calls from inside Postgres to the function URLs below.
# Netlify's built-in scheduled functions are flaky, so we register functions
# here with `timeout` only — no `schedule =` lines.

[functions."content-controller"]
  timeout = 60

[functions."generate-content-v2"]
  timeout = 60

[functions."generate-image"]
  timeout = 30

[functions."news-detector"]
  timeout = 60

[functions."generate-tweets"]
  timeout = 60

[functions."blog-scheduler"]
  timeout = 60

[functions."publish-approved"]
  timeout = 30

[functions."fetch-scores-v2"]
  timeout = 60

[functions."fetch-pga-graphql"]
  timeout = 60

[functions."fetch-odds"]
  timeout = 30

[functions."generate-picks"]
  timeout = 60

[functions."post-reddit"]
  timeout = 30
