name: Cron pinger

# Replaces Netlify's flaky scheduled functions.
# GitHub Actions scheduled workflows run on GitHub's infra with much better
# reliability than Netlify's built-in cron. All times are UTC.
#
# GitHub's scheduler can drift under load — 5-minute schedules sometimes
# fire 10-15 min late. That's still more reliable than Netlify for us.
# Functions are idempotent, so late firings just no-op.

on:
  schedule:
    # Every 5 minutes — frequent pipeline (scores, enrichment, publish)
    - cron: '*/5 * * * *'
    # Every 15 minutes — content pipeline (news detector + content controller)
    - cron: '*/15 * * * *'
    # Every 6 hours — odds refresh
    - cron: '17 */6 * * *'
    # Daily 05:00 UTC — picks
    - cron: '0 5 * * *'
    # Daily 10:00 UTC — tweet batch
    - cron: '0 10 * * *'
    # Daily 12:00 UTC — reddit post (~8am ET)
    - cron: '0 12 * * *'
  workflow_dispatch:
    # Manual run button from the Actions tab — good for debugging
    inputs:
      function:
        description: 'Single function to ping (leave blank for "every 5 min" set)'
        required: false
        default: ''

env:
  BASE: https://tourfeed.co/.netlify/functions

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Show schedule
        run: |
          echo "triggered_by=${{ github.event_name }}"
          echo "cron=${{ github.event.schedule }}"
          echo "manual_fn=${{ github.event.inputs.function }}"

      - name: Manual single function
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.function != '' }}
        run: |
          URL="$BASE/${{ github.event.inputs.function }}"
          echo "→ $URL"
          curl -sS -m 60 -o /dev/null -w "HTTP %{http_code} in %{time_total}s\n" "$URL"

      # Every 5 min set: scores, enrichment, publish
      - name: Ping fetch-scores-v2
        if: ${{ github.event.schedule == '*/5 * * * *' || (github.event_name == 'workflow_dispatch' && github.event.inputs.function == '') }}
        run: curl -sS -m 90 -o /dev/null -w "fetch-scores-v2: HTTP %{http_code} in %{time_total}s\n" "$BASE/fetch-scores-v2" || true

      - name: Ping fetch-pga-graphql
        if: ${{ github.event.schedule == '*/5 * * * *' || (github.event_name == 'workflow_dispatch' && github.event.inputs.function == '') }}
        run: curl -sS -m 90 -o /dev/null -w "fetch-pga-graphql: HTTP %{http_code} in %{time_total}s\n" "$BASE/fetch-pga-graphql" || true

      - name: Ping publish-approved
        if: ${{ github.event.schedule == '*/5 * * * *' || (github.event_name == 'workflow_dispatch' && github.event.inputs.function == '') }}
        run: curl -sS -m 90 -o /dev/null -w "publish-approved: HTTP %{http_code} in %{time_total}s\n" "$BASE/publish-approved" || true

      # Every 15 min set: news detector + content controller
      - name: Ping news-detector
        if: ${{ github.event.schedule == '*/15 * * * *' }}
        run: curl -sS -m 90 -o /dev/null -w "news-detector: HTTP %{http_code} in %{time_total}s\n" "$BASE/news-detector" || true

      - name: Ping content-controller
        if: ${{ github.event.schedule == '*/15 * * * *' }}
        run: curl -sS -m 90 -o /dev/null -w "content-controller: HTTP %{http_code} in %{time_total}s\n" "$BASE/content-controller" || true

      # Every 6 hours
      - name: Ping fetch-odds
        if: ${{ github.event.schedule == '17 */6 * * *' }}
        run: curl -sS -m 90 -o /dev/null -w "fetch-odds: HTTP %{http_code} in %{time_total}s\n" "$BASE/fetch-odds" || true

      # Daily picks
      - name: Ping generate-picks
        if: ${{ github.event.schedule == '0 5 * * *' }}
        run: curl -sS -m 120 -o /dev/null -w "generate-picks: HTTP %{http_code} in %{time_total}s\n" "$BASE/generate-picks" || true

      # Daily tweets
      - name: Ping generate-tweets
        if: ${{ github.event.schedule == '0 10 * * *' }}
        run: curl -sS -m 120 -o /dev/null -w "generate-tweets: HTTP %{http_code} in %{time_total}s\n" "$BASE/generate-tweets" || true

      # Daily reddit
      - name: Ping post-reddit
        if: ${{ github.event.schedule == '0 12 * * *' }}
        run: curl -sS -m 60 -o /dev/null -w "post-reddit: HTTP %{http_code} in %{time_total}s\n" "$BASE/post-reddit" || true
