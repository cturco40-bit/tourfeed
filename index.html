function esc(str) {
  if (!str) return '';
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/`/g,'&#96;').replace(/\$/g,'&#36;');
}

function timeAgo(dateStr) {
  if (!dateStr) return '';
  const mins = Math.round((Date.now() - new Date(dateStr).getTime()) / 60000);
  if (isNaN(mins) || mins < 0) return '';
  if (mins < 60) return mins + 'm ago';
  if (mins < 1440) return Math.round(mins/60) + 'h ago';
  const days = Math.round(mins/1440);
  if (days < 7) return days + 'd ago';
  return new Date(dateStr).toLocaleDateString('en-US', {month:'short', day:'numeric'});
}

function readTime(text) {
  if (!text) return '1 min';
  const words = text.replace(/<[^>]+>/g, '').split(/\s+/).length;
  return Math.max(1, Math.ceil(words / 200)) + ' min read';
}

function tagColor(tag) {
  const t = (tag || '').toUpperCase();
  if (t === 'RECAP' || t === 'TOURNAMENT') return 'var(--green)';
  if (t === 'BETTING' || t === 'ANALYSIS') return 'var(--gold)';
  if (t === 'PREVIEW') return 'var(--green)';
  if (t === 'BREAKING' || t === 'INJURY') return 'var(--s-red)';
  if (t === 'MAJOR') return 'var(--gold)';
  if (t === 'LIV GOLF') return 'var(--gold)';
  if (t === 'LPGA') return '#E91E8C';
  if (t === 'DP WORLD') return '#4A90D9';
  return 'var(--text-muted)';
}

function countryFlag(input) {
  if (!input) return '<span style="font-size:10px;color:var(--g500)">-</span>';
  let code = input.trim();
  if (code.length === 2) {
    code = code.toLowerCase();
  } else {
    code = (COUNTRY_MAP[code.toLowerCase()] || '').toLowerCase();
  }
  if (!code || code.length !== 2) return '<span style="font-size:10px;color:var(--g500)">-</span>';
  return '<img src="https://flagcdn.com/20x15/' + code + '.png" width="20" height="15" style="vertical-align:middle;border-radius:2px" alt="' + code.toUpperCase() + '" onerror="this.style.display=\'none\'">';
}

function formatPurse(purse) {
  const amt = typeof purse === 'number' ? purse : (purse?.amount || 0);
  if (!amt) return '';
  if (amt >= 1e6) return '$' + (amt/1e6).toFixed(amt%1e6===0?0:1) + 'M';
  if (amt >= 1e3) return '$' + (amt/1e3).toFixed(0) + 'K';
  return '$' + amt;
}

function scoreClass(s) {
  if (!s) return '';
  return s.startsWith('+') ? 'score-over' : s === 'E' ? 'score-even' : 'score-under';
}

function formatMovement(m) {
  if (m === undefined || m === null || m === 0) return '-';
  return m < 0 ? '\u2191' + Math.abs(m) : '\u2193' + m;
}

async function fetchESPNScores(tour) {
  const sport = ESPN_SPORTS[tour];
  if (!sport) {
    TOURNAMENT = null; PLAYERS = [];
    scoresError = 'No data source for this tour';
    scoresLoading = false;
    renderApp();
    return;
  }

  scoresLoading = true;
  scoresError = null;
  renderApp();

  try {
    const url = 'https://site.api.espn.com/apis/site/v2/sports/' + sport + '/scoreboard';
    const res = await fetch(url);
    if (!res.ok) throw new Error('ESPN ' + res.status);
    const data = await res.json();

    const event = data.events?.[0];
    if (!event) {
      scoresError = 'No active tournament';
      scoresLoading = false;
      TOURNAMENT = null; PLAYERS = [];
      renderApp();
      return;
    }

    const comp = event.competitions?.[0];
    if (!comp) throw new Error('No competition data');

    const st = comp.status || {};
    const period = st.period || 1;
    const coursePar = 72;
    const name = event.name || event.shortName || '';
    const isMajor = /masters|pga championship|u\.?s\.? open|open championship|the open/i.test(name);

    TOURNAMENT = {
      name: event.shortName || event.name || 'Tournament',
      course: comp.venue?.fullName || comp.venue?.shortName || '',
      dates: '',
      purse: formatPurse(comp.purse),
      status: st.type?.description || st.type?.shortDetail || 'In Progress',
      round: period,
      par: coursePar,
      broadcast: comp.broadcast?.names?.join(' / ') || comp.geoBroadcasts?.map(function(g){return g.media?.shortName}).filter(Boolean).join(' / ') || '',
      tour: TOURS.find(function(t){return t.id === tour})?.name || '',
      is_major: isMajor,
      eventId: event.id,
      stateName: (st.type?.name || '').toUpperCase(),
      state: st.type?.state || '',
    };

    try {
      const d = new Date(event.date);
      const mo = d.toLocaleString('en-US',{month:'short'});
      const day = d.getDate();
      const end = new Date(d); end.setDate(day + 3);
      TOURNAMENT.dates = mo + ' ' + day + '-' + end.getDate() + ', ' + d.getFullYear();
    } catch(e) {}

    const competitors = comp.competitors || [];
    PLAYERS = competitors.map(function(c) {
      const ath = c.athlete || {};
      const ls = c.linescores || [];

      let scoreDisp = '';
      if (typeof c.score === 'string') scoreDisp = c.score;
      else if (typeof c.score === 'number') scoreDisp = c.score === 0 ? 'E' : (c.score > 0 ? '+' + c.score : '' + c.score);
      else if (c.score?.displayValue) scoreDisp = c.score.displayValue;
      if (scoreDisp === '0' || scoreDisp === '+0') scoreDisp = 'E';

      const flagAlt = ath.flag?.alt || '';
      const citizenship = ath.citizenship || '';
      const flag = countryFlag(citizenship || flagAlt);

      const curRoundLS = ls[period - 1];
      const holesPlayed = curRoundLS?.linescores?.length || 0;
      let thruDisp = '';
      if (holesPlayed === 0) thruDisp = '-';
      else if (holesPlayed >= 18) thruDisp = 'F';
      else thruDisp = holesPlayed.toString();

      if (c.status?.thru != null) {
        thruDisp = c.status.thru >= 18 ? 'F' : c.status.thru.toString();
      } else if (c.status?.displayValue) {
        thruDisp = c.status.displayValue;
      } else {
        const sd = c.status?.type?.shortDetail || '';
        const thruMatch = sd.match(/thru\s*(\d+)/i);
        if (thruMatch) thruDisp = thruMatch[1];
        else if (/final|complete/i.test(sd)) thruDisp = 'F';
      }

      let todayDisp = '';
      if (curRoundLS) {
        const dv = curRoundLS.displayValue;
        if (dv && dv !== '-') todayDisp = dv;
      }

      const roundVal = function(idx) {
        const r = ls[idx];
        if (!r) return null;
        const holes = r.linescores?.length || 0;
        if (holes >= 18) return r.value || null;
        return null;
      };

      const statusName = (c.status?.type?.name || '').toUpperCase();
      const statusDesc = (c.status?.type?.description || '').toLowerCase();
      const isCut = statusName.includes('CUT') || statusDesc.includes('cut') || scoreDisp === 'CUT';
      const isWD = statusName.includes('WD') || statusName.includes('WITHDRAW') || statusDesc.includes('wd') || scoreDisp === 'WD';
      const isDQ = statusName.includes('DQ') || statusDesc.includes('disqualif') || scoreDisp === 'DQ';

      return {
        pos: '', name: ath.displayName || 'Unknown', c: flag,
        score: isCut ? 'MC' : isWD ? 'WD' : isDQ ? 'DQ' : scoreDisp,
        today: isCut || isWD || isDQ ? '-' : todayDisp,
        thru: thruDisp,
        r1: roundVal(0), r2: roundVal(1), r3: roundVal(2), r4: roundVal(3),
        sg: '', ch: '',
        status: isCut ? 'cut' : isWD ? 'wd' : isDQ ? 'dq' : 'active',
        holes: [], athleteId: ath.id || c.id, sortOrder: c.order || c.sortOrder || 999,
      };
    });

    PLAYERS.sort(function(a,b) { return a.sortOrder - b.sortOrder; });

    const activePlayers = PLAYERS.filter(function(p) { return p.status === 'active'; });
    activePlayers.forEach(function(p, i) {
      if (i > 0 && activePlayers[i-1].score === p.score) p.pos = activePlayers[i-1].pos;
      else p.pos = 'T' + (i + 1);
    });
    activePlayers.forEach(function(p, i) {
      const isTied = (i > 0 && activePlayers[i-1].score === p.score) ||
                     (i < activePlayers.length - 1 && activePlayers[i+1].score === p.score);
      if (!isTied) p.pos = p.pos.replace('T', '');
    });
    PLAYERS.forEach(function(p) {
      if (p.status === 'cut') p.pos = 'MC';
      else if (p.status === 'wd') p.pos = 'WD';
      else if (p.status === 'dq') p.pos = 'DQ';
    });

    lastFetchTime = new Date();
    scoresLoading = false;
    scoresError = null;
    renderApp();

    // Enrich with status data
    const stState = comp.status?.type?.state || '';
    if (stState !== 'in' && stState !== 'pre') { renderApp(); return; }

    const league = sport.replace('golf/', '') || 'pga';
    const eventId = event.id;
    const compId = comp.id || eventId;
    try {
      const allStatuses = [];
      for (let i = 0; i < PLAYERS.length; i += 20) {
        const batch = PLAYERS.slice(i, i + 20).map(function(p) {
          return fetch('https://sports.core.api.espn.com/v2/sports/golf/leagues/' + league + '/events/' + eventId + '/competitions/' + compId + '/competitors/' + p.athleteId + '/status')
            .then(function(r) { return r.ok ? r.json() : null; }).catch(function() { return null; });
        });
        const results = await Promise.all(batch);
        allStatuses.push.apply(allStatuses, results);
      }
      allStatuses.forEach(function(st, i) {
        if (!st || !PLAYERS[i]) return;
        const p = PLAYERS[i];
        if (st.position?.displayName) p.pos = st.position.displayName;
        if (st.thru != null) {
          if (st.type?.state === 'pre' || st.thru === 0) {
            if (st.teeTime) {
              const t = new Date(st.teeTime);
              p.thru = t.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
            } else p.thru = '-';
          } else if (st.thru >= 18) p.thru = 'F';
          else p.thru = st.thru.toString();
        }
        const stName = (st.type?.name || '').toUpperCase();
        if (stName.includes('CUT')) { p.status = 'cut'; p.pos = 'MC'; }
        else if (stName.includes('WD') || stName.includes('WITHDRAW')) { p.status = 'wd'; p.pos = 'WD'; }
        else if (stName.includes('DQ')) { p.status = 'dq'; p.pos = 'DQ'; }
      });
      renderApp();
    } catch(e) { console.error('Status enrichment error:', e); }
    return;
  } catch(err) {
    console.error('ESPN fetch error:', err);
    scoresError = 'Unable to load scores';
    scoresLoading = false;
  }
  renderApp();
}

async function fetchScorecard(playerIdx) {
  const p = PLAYERS[playerIdx];
  if (!p || !p.athleteId || !TOURNAMENT?.eventId) return;
  const round = TOURNAMENT.round;
  const cacheKey = p.athleteId + '-' + round;
  if (scorecardCache[cacheKey]) {
    PLAYERS[playerIdx].holes = scorecardCache[cacheKey].holes;
    PAR = scorecardCache[cacheKey].par.length ? scorecardCache[cacheKey].par : PAR;
    renderApp();
    return;
  }
  try {
    const sport = ESPN_SPORTS[currentScoresTour];
    const res = await fetch('https://site.api.espn.com/apis/site/v2/sports/' + sport + '/scoreboard/' + TOURNAMENT.eventId + '/competitors/' + p.athleteId + '/scorecard');
    if (!res.ok) return;
    const data = await res.json();
    const rounds = data.rounds || data.scorecard?.rounds || [];
    const target = rounds.find(function(r) { return r.period === round || r.roundNumber === round; }) || rounds[rounds.length-1];
    if (target) {
      const holeData = target.holes || target.linescores || [];
      const holes = holeData.map(function(h) { return h.score ?? h.value; });
      const par = holeData.map(function(h) { return h.par ?? h.parValue ?? 4; });
      if (holes.length === 18 && holes.every(function(h) { return typeof h === 'number'; })) {
        PLAYERS[playerIdx].holes = holes;
        PAR = par;
        scorecardCache[cacheKey] = { holes: holes, par: par };
        renderApp();
      }
    }
  } catch(e) {}
}

let newsArticles = [];
let blogArticles = [];
let bettingArticles = [];
let articlesLoaded = false;
let newsShowCount = 10;
let blogShowCount = 10;
let currentArticle = null; // Full article detail view

async function fetchAllArticles() {
  if (articlesLoaded) return;
  try {
    const { data, error } = await sb.from('articles')
      .select('*')
      .order('published_at', { ascending: false })
      .limit(50);
    if (error) throw error;
    const articles = data || [];

    newsArticles = articles.filter(function(a) {
      const t = (a.tag || a.type || '').toUpperCase();
      return t === 'NEWS' || t === 'RECAP' || t === 'BREAKING' || t === 'TOURNAMENT' ||
             t === 'ARTICLE_NEWS' || t === 'ARTICLE_RECAP' || t === 'INJURY' || t === 'TRANSFER' ||
             t === 'TOUR NEWS' || t === 'MAJOR';
    });
    blogArticles = articles.filter(function(a) {
      const t = (a.tag || a.type || '').toUpperCase();
      return t === 'PREVIEW' || t === 'ANALYSIS' || t === 'RANKINGS' || t === 'DFS' ||
             t === 'ARTICLE_PREVIEW' || t === 'ARTICLE_ANALYSIS' || t === 'POWER RANKINGS';
    });
    bettingArticles = articles.filter(function(a) {
      const t = (a.tag || a.type || '').toUpperCase();
      return t === 'BETTING' || t === 'ARTICLE_BETTING';
    });

    // If no Supabase articles yet, also fetch ESPN news as fallback
    if (newsArticles.length === 0) {
      try {
        const espnRes = await fetch('https://site.api.espn.com/apis/site/v2/sports/golf/pga/news?limit=15');
        if (espnRes.ok) {
          const espnData = await espnRes.json();
          (espnData.articles || []).forEach(function(a) {
            newsArticles.push({
              title: a.headline || '',
              summary: a.description || '',
              body: '<p>' + (a.description || '') + '</p>',
              header_image: a.images?.[0]?.url || '',
              tag: 'TOUR NEWS',
              published_at: a.published || new Date().toISOString(),
              slug: null,
              _espn: true,
            });
          });
        }
      } catch(e) {}
    }

    articlesLoaded = true;
  } catch(e) {
    console.warn('Articles fetch failed:', e);
  }
  renderApp();
}

// ESPN STANDINGS
// ============================================
let standingsLive = {};
let standingsLoading = false;
let standingsError = null;
let standingsFetched = {};
let standingsFilter = 'pga';

async function fetchESPNStandings(tour) {
  if (standingsFetched[tour]) return;
  const sport = ESPN_SPORTS[tour];
  if (!sport) { standingsError = 'Standings not available'; renderApp(); return; }
  standingsLoading = true;
  standingsError = null;
  renderApp();
  try {
    const res = await fetch('https://site.api.espn.com/apis/site/v2/sports/' + sport + '/standings');
    if (!res.ok) throw new Error('ESPN ' + res.status);
    const data = await res.json();
    const children = data.children || data.standings || [];
    const standing = children[0] || data;
    const entries = standing.entries || standing.standings?.[0]?.entries || [];
    standingsLive[tour] = entries.map(function(e, i) {
      const stats = {};
      (e.stats || []).forEach(function(s) { stats[s.name || s.abbreviation] = s.displayValue || s.value; });
      return {
        pos: i + 1,
        p: e.athlete?.displayName || e.team?.displayName || 'Unknown',
        pts: stats.points || stats.cupPoints || stats.totalPoints || '-',
        w: parseInt(stats.wins || stats.gamesWon || '0') || 0,
        t10: parseInt(stats.top10 || stats.top10Finishes || '0') || 0,
        earn: stats.earnings || stats.totalEarnings || stats.money || '-',
      };
    });
    standingsFetched[tour] = true;
    standingsLoading = false;
  } catch(e) {
    standingsError = 'Standings unavailable';
    standingsLoading = false;
  }
  renderApp();
}

// ============================================
// ESPN SCHEDULE
// ============================================
let scheduleData = [];
let scheduleLoading = false;
let scheduleError = null;
let scheduleFetched = false;

async function fetchESPNSchedule() {
  if (scheduleFetched && scheduleData.length > 0) return;
  scheduleLoading = true;
  scheduleError = null;
  renderApp();
  try {
    const tours = [
      { id: 'pga', sport: 'golf/pga' },
      { id: 'lpga', sport: 'golf/lpga' },
      { id: 'dpw', sport: 'golf/eur' },
    ];
    const allEvents = [];
    for (const tour of tours) {
      try {
        const res = await fetch('https://site.api.espn.com/apis/site/v2/sports/' + tour.sport + '/scoreboard?dates=' + new Date().getFullYear());
        if (!res.ok) continue;
        const data = await res.json();
        (data.events || []).forEach(function(ev) {
          const comp = ev.competitions?.[0];
          const st = comp?.status?.type;
          const isLive = st?.name === 'STATUS_IN_PROGRESS';
          const isMajor = /masters|pga championship|u\.?s\.? open|open championship|the open/i.test(ev.name || '');
          let dateStr = '';
          try {
            const d = new Date(ev.date);
            const mo = d.toLocaleString('en-US',{month:'short'});
            const day = d.getDate();
            const end = new Date(d); end.setDate(day+3);
            dateStr = mo + ' ' + day + '-' + end.getDate();
          } catch(e) {}
          allEvents.push({
            event: ev.shortName || ev.name || '',
            course: comp?.venue?.fullName || '',
            dates: dateStr,
            purse: formatPurse(comp?.purse),
            tour: tour.id,
            tv: comp?.broadcast?.names?.join(' / ') || comp?.geoBroadcasts?.map(function(g){return g.media?.shortName}).filter(Boolean).join(' / ') || '',
            live: isLive, major: isMajor, startDate: ev.date,
          });
        });
      } catch(e) { continue; }
    }
    allEvents.sort(function(a,b) { return new Date(a.startDate) - new Date(b.startDate); });
    scheduleData = allEvents;
    scheduleFetched = true;
    scheduleLoading = false;
  } catch(e) {
    scheduleError = 'Unable to load schedule';
    scheduleLoading = false;
  }
  renderApp();
}

function renderNav() {
  const nav = document.getElementById('nav');
  nav.innerHTML = TABS.map(function(t,i) {
    return '<button class="nav-btn ' + (i===currentTab?'active':'') + '" onclick="switchTab(' + i + ')">' + t + '</button>';
  }).join('');
}

function switchTab(i) {
  currentTab = i;
  expandedCard = null;
  currentArticle = null;
  newsShowCount = 10;
  blogShowCount = 10;
  renderNav();
  if (i === 2 || i === 3 || i === 4 || i === 0) fetchAllArticles();
  if (i === 5 && !standingsFetched[standingsFilter]) fetchESPNStandings(standingsFilter);
  if (i === 6 || i === 3 || i === 0) { if (!scheduleFetched) fetchESPNSchedule(); }
  renderApp();
  // Update URL
  if (i === 0) history.pushState(null, '', '/');
  window.scrollTo(0, 0);
}

function shareArticle(title, slug) {
  const url = slug ? 'https://tourfeed.co/article/' + slug : 'https://tourfeed.co';
  if (navigator.share) {
    navigator.share({ title: title, url: url });
  } else {
    navigator.clipboard.writeText(url);
    alert('Link copied!');
  }
}

  const url = slug ? 'https://tourfeed.co/article/' + slug : 'https://tourfeed.co';
  window.open('https://twitter.com/intent/tweet?text=' + encodeURIComponent(title) + '&url=' + encodeURIComponent(url), '_blank');
}

  html += '<div class="article-detail-body">' + (a.body || '<p>' + esc(a.summary || '') + '</p>') + '</div>';

  // Share buttons
  html += '<div class="share-row">';
  html += '<button class="share-btn" onclick="shareTwitter(\'' + esc(a.title).replace(/'/g,"\\'") + '\',\'' + esc(a.slug || '') + '\')">Share on X</button>';
  html += '<button class="share-btn" onclick="shareArticle(\'' + esc(a.title).replace(/'/g,"\\'") + '\',\'' + esc(a.slug || '') + '\')">Copy Link</button>';
  html += '</div>';

  // Email CTA
  if (!localStorage.getItem('tf-subscribed')) {
    html += '<div class="email-cta">';
    html += '<div class="email-cta-title">Get TourFeed in your inbox</div>';
    html += '<div class="email-cta-sub">Scores, recaps, and betting insights. Free, no spam.</div>';
    html += '<div class="email-cta-form">';
    html += '<input type="email" id="inlineEmail" placeholder="Your email">';
    html += '<button onclick="subscribeInline(\'inlineEmail\')">Subscribe</button>';
    html += '</div></div>';
  }

  // Related articles
  const allArticles = (currentTab === 4 ? blogArticles : currentTab === 3 ? bettingArticles : newsArticles);
  const related = allArticles.filter(function(r) { return r.id !== a.id && r.title !== a.title; }).slice(0, 3);
  if (related.length > 0) {
    html += '<div class="related-section">';
    html += '<div class="related-title">MORE FROM TOURFEED</div>';
    related.forEach(function(r) {
      html += renderArticleCard(r);
    });

  }

  html += '</div>';
  return html;
}

// ============================================
// SCORECARD RENDERER
// ============================================
function renderScorecard(p) {
  if (!p.holes || p.holes.length === 0) {
    const rounds = [p.r1, p.r2, p.r3, p.r4].filter(function(r) { return r !== null && r !== undefined; });
    const coursePar = TOURNAMENT?.par || 72;
    let html = '<div class="scorecard"><div class="scorecard-title">Round Scores - ' + p.name + '</div>';
    html += '<div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:8px">';
    rounds.forEach(function(r, i) {
      const diff = r - coursePar;
      const diffStr = diff === 0 ? 'E' : (diff > 0 ? '+' + diff : '' + diff);
      const color = diff < 0 ? 'var(--s-green)' : diff > 0 ? 'var(--s-red)' : 'var(--g400)';
      html += '<div style="text-align:center;min-width:56px"><div style="font-size:9px;color:var(--g700);font-weight:600;letter-spacing:1px">R' + (i+1) + '</div><div style="font-size:22px;font-weight:800;margin-top:2px">' + r + '</div><div style="font-size:11px;font-weight:700;color:' + color + ';margin-top:1px">' + diffStr + '</div></div>';
    });
    if (rounds.length > 0) {
      html += '<div style="text-align:center;min-width:56px;border-left:1px solid var(--card-border);padding-left:12px"><div style="font-size:9px;color:var(--g700);font-weight:600;letter-spacing:1px">TOTAL</div><div style="font-size:22px;font-weight:800;margin-top:2px">' + rounds.reduce(function(a,b){return a+b;},0) + '</div><div style="font-size:11px;font-weight:700;color:' + (p.score.startsWith('+')?'var(--s-red)':p.score==='E'?'var(--g400)':'var(--s-green)') + ';margin-top:1px">' + p.score + '</div></div>';
    }
    html += '</div></div>';
    return html;
  }

  const front = p.holes.slice(0,9);
  const back = p.holes.slice(9);
  const frontPar = PAR.length >= 18 ? PAR.slice(0,9) : [4,4,4,3,4,3,4,5,4];
  const backPar = PAR.length >= 18 ? PAR.slice(9) : [4,4,3,5,4,5,3,4,4];

  function holeClass(score, par) {
    const d = score - par;
    if (d <= -2) return 'hole-eagle';
    if (d === -1) return 'hole-birdie';
    if (d === 1) return 'hole-bogey';
    if (d >= 2) return 'hole-double';
    return 'hole-par';
  }

  const rd = TOURNAMENT?.round || '';
  let html = '<div class="scorecard"><div class="scorecard-title">' + (rd ? 'Round ' + rd + ' ' : '') + 'Scorecard - ' + p.name + '</div>';
  html += '<table><tr style="color:var(--g700);font-weight:600"><td style="text-align:left;padding-left:6px">Hole</td>';
  for (let h = 1; h <= 9; h++) html += '<td>' + h + '</td>';
  html += '<td style="font-weight:800">OUT</td>';
  for (let h = 10; h <= 18; h++) html += '<td>' + h + '</td>';
  html += '<td style="font-weight:800">IN</td><td style="font-weight:800">TOT</td></tr>';
  html += '<tr style="color:var(--text-muted)"><td style="text-align:left;padding-left:6px;font-weight:600">Par</td>';
  frontPar.forEach(function(v) { html += '<td>' + v + '</td>'; });
  html += '<td style="font-weight:700">' + frontPar.reduce(function(a,b){return a+b;},0) + '</td>';
  backPar.forEach(function(v) { html += '<td>' + v + '</td>'; });
  html += '<td style="font-weight:700">' + backPar.reduce(function(a,b){return a+b;},0) + '</td>';
  html += '<td style="font-weight:700">' + frontPar.concat(backPar).reduce(function(a,b){return a+b;},0) + '</td></tr>';
  html += '<tr><td style="text-align:left;padding-left:6px;font-weight:600">Score</td>';
  front.forEach(function(v,i) { html += '<td class="' + holeClass(v,frontPar[i]) + '">' + v + '</td>'; });
  html += '<td style="font-weight:800">' + front.reduce(function(a,b){return a+b;},0) + '</td>';
  back.forEach(function(v,i) { html += '<td class="' + holeClass(v,backPar[i]) + '">' + v + '</td>'; });
  html += '<td style="font-weight:800">' + back.reduce(function(a,b){return a+b;},0) + '</td>';
  html += '<td style="font-weight:800;color:var(--s-green)">' + p.holes.reduce(function(a,b){return a+b;},0) + '</td></tr></table></div>';
  return html;
}

function isTeetime(thru) {
  if (!thru) return false;
  return /\d{1,2}:\d{2}\s*(AM|PM|am|pm)/i.test(thru);
}

function renderTeeTimes() {
  const withTimes = PLAYERS.filter(function(p) { return p.status === 'active' && isTeetime(p.thru); });
  if (withTimes.length === 0) {
    return '<div style="text-align:center;padding:40px 20px"><div style="font-size:14px;font-weight:700;color:var(--text-dim)">No tee times available</div></div>';
  }
  const groups = {};
  withTimes.forEach(function(p) { const t = p.thru.trim(); if (!groups[t]) groups[t] = []; groups[t].push(p); });
  const sortedTimes = Object.keys(groups).sort(function(a, b) {
    const toMin = function(t) { const m = t.match(/(\d{1,2}):(\d{2})\s*(AM|PM)/i); if (!m) return 0; let h = parseInt(m[1]); const min = parseInt(m[2]); const pm = m[3].toUpperCase() === 'PM'; if (pm && h !== 12) h += 12; if (!pm && h === 12) h = 0; return h * 60 + min; };
    return toMin(a) - toMin(b);
  });
  let html = '<div class="search"><input placeholder="Search players..." oninput="lbSearch=this.value;renderApp()" value="' + lbSearch + '"></div>';
  const searchFilter = lbSearch.toLowerCase();
  sortedTimes.forEach(function(time) {
    let players = groups[time];
    if (searchFilter) { players = players.filter(function(p) { return p.name.toLowerCase().includes(searchFilter); }); if (players.length === 0) return; }
    html += '<div style="margin-top:14px;margin-bottom:6px;display:flex;align-items:center;gap:10px"><div style="font-size:15px;font-weight:800;color:var(--text)">' + time + '</div><div style="flex:1;height:1px;background:var(--card-border)"></div></div>';
    players.forEach(function(p) {
      html += '<div style="display:flex;align-items:center;padding:10px 12px;background:var(--card-bg);border:1px solid var(--card-border);border-radius:8px;margin-bottom:4px"><span style="font-size:14px;margin-right:8px">' + p.c + '</span><div style="flex:1"><div style="font-size:14px;font-weight:700;color:var(--text)">' + p.name + '</div></div><div class="lb-total ' + scoreClass(p.score) + '" style="font-size:16px">' + (p.score || '-') + '</div></div>';
    });
  });
  return html;
}

  html += '<div class="search"><input placeholder="Search ' + PLAYERS.length + ' players..." oninput="lbSearch=this.value;renderApp()" value="' + lbSearch + '"></div>';
  html += '<div class="lb-header"><div style="width:28px">POS</div><div style="flex:1">PLAYER</div>';
  roundCols.forEach(function(r) { html += '<div class="r-col" style="width:30px;text-align:center">R' + r + '</div>'; });
  html += '<div style="width:36px;text-align:center">TODAY</div><div style="width:56px;text-align:center">THRU</div><div style="width:46px;text-align:right">TOTAL</div></div>';

  active.forEach(function(p,i) {
    // Cut line
    if (i > 0 && TOURNAMENT.round <= 2 && p.score && active[i-1].score) {
      if (p.score.startsWith('+') && !active[i-1].score.startsWith('+')) {
        html += '<div class="cut-line"><div class="cut-line-bar"></div><span class="cut-line-text">PROJECTED CUT</span><div class="cut-line-bar"></div></div>';
      }
    }
    const idx = PLAYERS.indexOf(p);
    const rounds = [p.r1, p.r2, p.r3, p.r4];
    const todayClass = !p.today ? '' : p.today.startsWith('+') ? 'score-over' : p.today === 'E' ? 'score-even' : 'score-under';
    html += '<div class="lb-row ' + (i===0?'leader':'') + '" onclick="expandPlayer(' + idx + ')"><div class="lb-pos" style="color:' + (i===0?'var(--gold)':'var(--g500)') + '">' + p.pos + '</div><div class="lb-player"><span class="lb-flag">' + p.c + '</span><span class="lb-name ' + (i===0?'top':'') + '">' + p.name + '</span></div>';
    roundCols.forEach(function(r) { html += '<div class="lb-round r-col">' + (rounds[r-1]||'') + '</div>'; });
    html += '<div class="lb-round r-col ' + todayClass + '" style="width:36px">' + (p.today||'') + '</div><div class="lb-today" style="color:var(--text-muted);font-size:11px">' + (p.thru||'') + '</div><div class="lb-total ' + scoreClass(p.score) + '">' + p.score + '</div></div>';
    if (expandedCard === idx) html += renderScorecard(p);
  });

  if (cut.length > 0) {
    html += '<div class="section-label" style="margin-top:16px">MISSED CUT</div>';
    cut.forEach(function(p) {
      html += '<div class="lb-row" style="opacity:0.5"><div class="lb-pos" style="color:var(--s-red)">' + p.pos + '</div><div class="lb-player"><span class="lb-flag">' + p.c + '</span><span class="lb-name">' + p.name + '</span></div>';
      roundCols.forEach(function(r) { html += '<div class="lb-round r-col">' + ([p.r1,p.r2,p.r3,p.r4][r-1]||'-') + '</div>'; });
      html += '<div class="lb-round r-col" style="width:36px">-</div><div class="lb-today">-</div><div class="lb-total score-over">' + p.score + '</div></div>';
    });
  }

  if (wd.length > 0) {
    html += '<div class="section-label" style="margin-top:16px">WITHDRAWN / DQ</div>';
    wd.forEach(function(p) {
      html += '<div class="lb-row" style="opacity:0.4"><div class="lb-pos" style="color:var(--text-muted)">' + p.pos + '</div><div class="lb-player"><span class="lb-flag">' + p.c + '</span><span class="lb-name">' + p.name + '</span></div>';
      roundCols.forEach(function(r) { html += '<div class="lb-round r-col">' + ([p.r1,p.r2,p.r3,p.r4][r-1]||'-') + '</div>'; });
      html += '<div class="lb-round r-col" style="width:36px">-</div><div class="lb-today">-</div><div class="lb-total score-over">' + (p.score||'-') + '</div></div>';
    });
  }

  html += '<div style="text-align:center;padding:16px 0;font-size:11px;color:var(--g700)">' + PLAYERS.length + ' players &middot; Auto-refreshing every 30s</div>';
  return html;
}

async function fetchTourInsights(tourId, sport) {
  if (insightsCache[tourId] !== undefined) return insightsCache[tourId];
  try {
    const res = await fetch('https://site.api.espn.com/apis/site/v2/sports/' + sport + '/scoreboard');
    if (!res.ok) { insightsCache[tourId] = null; return null; }
    const data = await res.json();
    const evt = data.events?.[0];
    if (!evt) { insightsCache[tourId] = null; return null; }
    const comp = evt.competitions?.[0];
    if (!comp) { insightsCache[tourId] = null; return null; }
    const players = (comp.competitors || []).slice(0, 20);
    if (players.length === 0) { insightsCache[tourId] = null; return null; }
    const status = comp.status || {};
    insightsCache[tourId] = {
      name: evt.shortName || evt.name || '',
      course: comp.venue?.fullName || '',
      round: status.period || 1,
      state: status.type?.state || '',
      stateName: (status.type?.name || '').toUpperCase(),
      statusText: status.type?.description || '',
      players: players.map(function(p) {
        return {
          name: p.athlete?.shortName || p.athlete?.displayName || '?',
          fullName: p.athlete?.displayName || '?',
          score: typeof p.score === 'string' ? p.score : (typeof p.score === 'number' ? (p.score === 0 ? 'E' : p.score > 0 ? '+' + p.score : '' + p.score) : '?'),
          today: p.linescores?.[(status.period || 1) - 1]?.displayValue || '',
          order: p.order || 99,
        };
      }),
    };
    return insightsCache[tourId];
  } catch(e) { insightsCache[tourId] = null; return null; }
}

let insightsExpanded = {};
function toggleInsightSection(key) {
  insightsExpanded[key] = !insightsExpanded[key];
  renderApp();
}

function renderInsights() {
  if (currentArticle) return renderArticleDetail(currentArticle);

  var parseScore = function(s) { if (!s || s === 'E') return 0; return parseInt(s) || 0; };
  var toOdds = function(pct) { return pct >= 50 ? '-' + Math.round(pct / (100 - pct) * 100) : '+' + Math.round((100 - pct) / pct * 100); };
  var calcWinProb = function(back, rd) {
    var mult = rd === 4 ? 1.0 : rd === 3 ? 0.6 : rd === 2 ? 0.35 : 0.2;
    return Math.max(0.5, Math.exp(-0.55 * back) * 30 * mult);
  };

  function pickRow(label, name, odds, reason, conf, units) {
    var bgColor = label === 'FAVORITE' ? 'rgba(45,143,111,0.08)' : label === 'VALUE' ? 'rgba(212,168,83,0.08)' : label === 'LONGSHOT' ? 'rgba(74,144,217,0.08)' : 'rgba(255,255,255,0.03)';
    var pColor = label === 'FAVORITE' ? 'var(--green)' : label === 'VALUE' ? 'var(--gold)' : label === 'LONGSHOT' ? '#4A90D9' : 'var(--text-muted)';
    var pBg = label === 'FAVORITE' ? 'rgba(45,143,111,0.15)' : label === 'VALUE' ? 'rgba(212,168,83,0.15)' : label === 'LONGSHOT' ? 'rgba(74,144,217,0.15)' : 'rgba(255,255,255,0.06)';
    var h = '<div class="pick-row" style="background:' + bgColor + ';flex-wrap:wrap">';
    h += '<span class="tag" style="color:' + pColor + ';background:' + pBg + ';font-size:9px;margin-right:8px">' + label + '</span>';
    h += '<div class="pick-row-info"><div class="pick-row-name">' + name + '</div>';
    if (reason) h += '<div class="pick-row-detail">' + reason + '</div>';
    h += '</div>';
    h += '<div style="text-align:right;flex-shrink:0"><div class="pick-row-odds" style="color:' + pColor + '">' + odds + '</div>';
    if (conf) h += '<div style="font-size:9px;color:var(--text-muted)">' + conf + '/10' + (units ? ' &middot; ' + units : '') + '</div>';
    h += '</div></div>';
    return h;
  }

  function sectionHeader(title, key) {
    var open = insightsExpanded[key] !== false; // default open
    return '<div onclick="toggleInsightSection(\'' + key + '\')" style="display:flex;align-items:center;justify-content:space-between;padding:10px 0;cursor:pointer;border-bottom:1px solid var(--card-border);margin-bottom:8px"><div style="font-size:11px;font-weight:700;letter-spacing:2px;color:var(--g700)">' + title + '</div><div style="font-size:10px;color:var(--text-muted)">' + (open ? '&#9650;' : '&#9660;') + '</div></div>';
  }

  function isSectionOpen(key) {
    return insightsExpanded[key] !== false;
  }

  var html = '';

  // ── UPCOMING EVENTS WITH FULL PICKS (top of page) ──
  if (!scheduleFetched) fetchESPNSchedule();
  if (scheduleData.length > 0) {
    var now = Date.now();
    var upcoming = scheduleData.filter(function(e) { return e.startDate && new Date(e.startDate).getTime() > now; }).slice(0, 3);
    upcoming.forEach(function(ev, evIdx) {
      var d = new Date(ev.startDate);
      var dateStr = d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
      var daysUntil = Math.ceil((d.getTime() - now) / 86400000);
      var daysLabel = daysUntil === 0 ? 'TODAY' : daysUntil === 1 ? 'TOMORROW' : daysUntil + ' DAYS';
      var isMajor = /masters|pga championship|u\.?s\.?\s*open|open championship|the open/i.test(ev.event);
      html += '<div class="insight-card" style="' + (isMajor ? 'border:1px solid rgba(212,168,83,0.25);' : '') + '">';
      html += '<div style="display:flex;align-items:center;margin-bottom:6px">';
      html += '<div style="font-size:10px;font-weight:700;letter-spacing:2px;color:' + (isMajor ? 'var(--gold)' : 'var(--green)') + '">' + (isMajor ? 'MAJOR' : 'UPCOMING') + '</div>';
      html += '<span style="font-size:10px;font-weight:700;color:var(--text-muted);margin-left:auto;background:rgba(255,255,255,0.05);padding:2px 8px;border-radius:4px">' + daysLabel + '</span></div>';
      html += '<div style="font-size:18px;font-weight:900;color:var(--text);margin-bottom:4px">' + esc(ev.event) + '</div>';
      html += '<div style="font-size:11px;color:var(--text-muted);margin-bottom:2px">' + esc(ev.course) + '</div>';
      html += '<div style="font-size:11px;color:var(--text-muted);margin-bottom:10px">' + dateStr + (ev.purse ? ' &middot; ' + ev.purse : '') + (ev.tv ? ' &middot; ' + ev.tv : '') + '</div>';
      html += '<div style="font-size:12px;color:var(--text-muted)">Full betting preview, picks, and analysis available in our published articles below.</div>';
      html += '</div>';
    });
  }

  // ── PUBLISHED BETTING ARTICLES ──
  if (bettingArticles && bettingArticles.length > 0) {
    html += '<div class="section-label">BETTING ANALYSIS</div>';
    bettingArticles.forEach(function(a) { html += renderArticleCard(a); });
    html += '<div style="height:16px"></div>';
  }

  // ── LIVE TOURNAMENT PICKS (in-progress only) ──
  if (TOURNAMENT && PLAYERS.length > 0) {
    var active = PLAYERS.filter(function(p) { return p.status === 'active'; });
    var isLive = TOURNAMENT.state === 'in';
    if (active.length > 0 && isLive) {
      var leader = active[0];
      var leaderNum = parseScore(leader.score);
      var withProb = active.slice(0, 20).map(function(p) { var back = Math.abs(parseScore(p.score) - leaderNum); return Object.assign({}, p, {back: back, raw: calcWinProb(back, TOURNAMENT.round)}); });
      var totalRaw = withProb.reduce(function(s, p) { return s + p.raw; }, 0) + 10;
      var odds = withProb.map(function(p) { return Object.assign({}, p, {pct: (p.raw / totalRaw) * 100}); });

      var bestVal = odds.filter(function(p) { return p.back >= 1 && p.back <= 3; }).sort(function(a,b) { return (a.back + (parseScore(a.today)||0)*0.5) - (b.back + (parseScore(b.today)||0)*0.5); })[0];
      var longshot = odds.filter(function(p) { return p.back >= 4 && p.back <= 7; }).sort(function(a,b) { return (parseScore(a.today)||0) - (parseScore(b.today)||0); })[0];
      var hotToday = odds.filter(function(p) { return p.today && parseScore(p.today) <= -3; }).sort(function(a,b) { return parseScore(a.today) - parseScore(b.today); })[0];
      var top5Pick = odds.filter(function(p) { return p.back >= 0 && p.back <= 2; }).sort(function(a,b) { return (parseScore(a.today)||0) - (parseScore(b.today)||0); })[0];

      html += '<div class="insight-card" style="border:1px solid rgba(45,143,111,0.25)">';
      html += '<div style="display:flex;align-items:center;margin-bottom:6px"><div style="font-size:10px;font-weight:700;letter-spacing:2px;color:var(--green)">LIVE &middot; PGA TOUR</div>';
      html += '<span style="font-size:10px;color:var(--text-muted);margin-left:auto">R' + TOURNAMENT.round + ' &middot; ' + TOURNAMENT.status + '</span></div>';
      html += '<div style="font-size:16px;font-weight:800;color:var(--text);margin-bottom:12px">' + TOURNAMENT.name + '</div>';

      if (bestVal) html += pickRow('BEST BET', bestVal.name, toOdds(bestVal.pct), bestVal.score + ' overall' + (bestVal.today ? ' &middot; ' + bestVal.today + ' today' : '') + ' &middot; ' + bestVal.back + ' back');
      if (longshot) html += pickRow('LONGSHOT', longshot.name, toOdds(longshot.pct), longshot.score + ' overall &middot; ' + longshot.back + ' back');
      if (hotToday) html += pickRow('HOT TODAY', hotToday.name, hotToday.today + ' today', hotToday.score + ' overall');
      if (top5Pick && top5Pick.name !== bestVal?.name) html += pickRow('TOP 5', top5Pick.name, toOdds(top5Pick.pct), top5Pick.score + ' overall');

      // Odds table
      html += '<div style="margin-top:10px;font-size:10px;font-weight:700;letter-spacing:1px;color:var(--g700);margin-bottom:6px">OUTRIGHT ODDS</div>';
      odds.slice(0, 10).forEach(function(p, i) {
        var barW = Math.max(4, Math.min(100, p.pct * 3));
        html += '<div class="odds-table-row"><div style="flex:1;font-size:12px;font-weight:600;color:var(--text)">' + p.name + '</div><div class="odds-bar"><div class="odds-bar-inner"><div style="height:100%;width:' + barW + '%;background:var(--green);border-radius:3px"></div></div></div><div style="width:32px;text-align:right;font-size:10px;font-weight:700;color:var(--text)">' + p.pct.toFixed(1) + '%</div><div style="width:42px;text-align:right;font-size:10px;font-weight:700;color:var(--text-muted)">' + toOdds(p.pct) + '</div></div>';
      });
      html += '</div>';
    }
  }

  // ── FETCH OTHER TOURS ──
  var otherTours = [
    { id: 'lpga', sport: 'golf/lpga', label: 'LPGA', color: '#E91E8C' },
    { id: 'dpw', sport: 'golf/eur', label: 'DP WORLD TOUR', color: '#4A90D9' },
  ];
  var uncached = otherTours.filter(function(t) { return insightsCache[t.id] === undefined; });
  if (uncached.length > 0) {
    (async function() { for (var t of uncached) await fetchTourInsights(t.id, t.sport); renderApp(); })();
  }

  // ── SEASON RECORD ──
  html += '<div class="insight-card"><div style="font-size:10px;font-weight:700;letter-spacing:2px;color:var(--green);margin-bottom:8px">SEASON RECORD</div>';
  html += '<div style="display:flex;gap:16px;justify-content:center">';
  html += '<div style="text-align:center"><div style="font-size:20px;font-weight:800">--</div><div style="font-size:9px;color:var(--text-muted)">WINS</div></div>';
  html += '<div style="text-align:center"><div style="font-size:20px;font-weight:800">--</div><div style="font-size:9px;color:var(--text-muted)">LOSSES</div></div>';
  html += '<div style="text-align:center"><div style="font-size:20px;font-weight:800">--</div><div style="font-size:9px;color:var(--text-muted)">ROI</div></div></div>';
  html += '<div style="font-size:10px;color:var(--text-muted);text-align:center;margin-top:8px">Record tracking begins with Masters 2026</div></div>';

  // ── COMPLETED TOURNAMENTS (collapsed at bottom) ──
  var completedHtml = '';
  // PGA completed
  if (TOURNAMENT && PLAYERS.length > 0 && (TOURNAMENT.stateName === 'STATUS_FINAL' || TOURNAMENT.state === 'post')) {
    var winner = PLAYERS.filter(function(p) { return p.status === 'active'; })[0];
    if (winner) {
      completedHtml += '<div style="padding:10px 12px;background:rgba(255,255,255,0.02);border-radius:8px;margin-bottom:6px;display:flex;align-items:center">';
      completedHtml += '<div style="flex:1"><div style="font-size:13px;font-weight:700;color:var(--text)">' + esc(TOURNAMENT.name) + '</div><div style="font-size:11px;color:var(--text-muted)">PGA Tour</div></div>';
      completedHtml += '<div style="text-align:right"><div style="font-size:12px;font-weight:700;color:var(--s-green)">' + winner.name + '</div><div style="font-size:10px;color:var(--text-muted)">' + winner.score + '</div></div></div>';
    }
  }
  // Other tour completed
  otherTours.forEach(function(t) {
    var data = insightsCache[t.id];
    if (data && (data.stateName === 'STATUS_FINAL' || data.state === 'post') && data.players.length > 0) {
      var w = data.players[0];
      completedHtml += '<div style="padding:10px 12px;background:rgba(255,255,255,0.02);border-radius:8px;margin-bottom:6px;display:flex;align-items:center">';
      completedHtml += '<div style="flex:1"><div style="font-size:13px;font-weight:700;color:var(--text)">' + data.name + '</div><div style="font-size:11px;color:var(--text-muted)">' + t.label + '</div></div>';
      completedHtml += '<div style="text-align:right"><div style="font-size:12px;font-weight:700;color:var(--s-green)">' + w.fullName + '</div><div style="font-size:10px;color:var(--text-muted)">' + w.score + '</div></div></div>';
    }
  });

  if (completedHtml) {
    html += '<div class="insight-card" style="opacity:0.7">';
    html += '<div style="font-size:10px;font-weight:700;letter-spacing:2px;color:var(--g700);margin-bottom:8px">COMPLETED</div>';
    html += completedHtml;
    html += '</div>';
  }

  html += '<div class="disclaimer">All picks are model-generated for entertainment only. Please gamble responsibly. If you or someone you know has a gambling problem, call 1-800-GAMBLER.</div>';
  return html;
}

// ============================================
// RENDER BLOG TAB
// ============================================
function renderBlog() {
  if (currentArticle) return renderArticleDetail(currentArticle);

  if (!articlesLoaded) {
    fetchAllArticles();
    return '<div style="text-align:center;padding:60px 20px"><div style="font-size:14px;font-weight:700;color:var(--text-dim)">Loading articles...</div></div>';
  }

  if (blogArticles.length === 0) {
    return '<div style="text-align:center;padding:40px 20px"><div style="font-size:14px;font-weight:700;color:var(--text-dim)">No blog posts yet</div><div style="font-size:12px;color:var(--text-muted);margin-top:6px">Previews, analysis, and power rankings will appear here</div></div>';
  }

  let html = '<div class="section-label">ANALYSIS & PREVIEWS</div>';
  const visible = blogArticles.slice(0, blogShowCount);
  visible.forEach(function(a) { html += renderArticleCard(a); });
  if (blogShowCount < blogArticles.length) {
    html += '<button class="load-more" onclick="blogShowCount+=10;renderApp()">Load More</button>';
  }
  return html;
}

// ============================================
// RENDER STANDINGS
// ============================================
function switchStandingsTour(tour) {
  standingsFilter = tour;
  if (!standingsFetched[tour]) fetchESPNStandings(tour);
  renderApp();
}

function renderStandings() {
  let html = '<div class="filter-bar">';
  ['pga','dpw','lpga','kft','champ'].forEach(function(t) {
    html += '<button class="filter-btn ' + (standingsFilter===t?'active':'') + '" onclick="switchStandingsTour(\'' + t + '\')">' + (TOURS.find(function(x){return x.id===t})?.short||t) + '</button>';
  });
  html += '</div>';

  if (standingsLoading) return html + '<div style="text-align:center;padding:40px 20px"><div style="font-size:14px;font-weight:700;color:var(--text-dim)">Loading standings...</div></div>';

  const data = standingsLive[standingsFilter];
  if (!data || data.length === 0) return html + '<div style="text-align:center;padding:40px 20px"><div style="font-size:13px;color:var(--text-muted)">' + (standingsError || 'Standings will populate once ESPN data is available') + '</div><button class="filter-btn" style="margin-top:14px;color:var(--green);border:1px solid var(--green)" onclick="standingsFetched[\'' + standingsFilter + '\']=false;fetchESPNStandings(\'' + standingsFilter + '\')">Retry</button></div>';

  const tourNames = {pga:'FedExCup',dpw:'Race to Dubai',lpga:'Race to CME Globe',kft:'Korn Ferry Points',champ:'Charles Schwab Cup'};
  html += '<div style="font-size:16px;font-weight:800;margin-bottom:10px">' + (tourNames[standingsFilter] || 'Standings') + '</div>';
  html += '<div class="lb-header"><div style="width:28px">POS</div><div style="flex:1">PLAYER</div><div style="width:56px;text-align:center">PTS</div><div style="width:36px;text-align:center">WINS</div><div style="width:40px;text-align:center">TOP 10</div><div style="width:64px;text-align:right">EARNINGS</div></div>';
  data.forEach(function(r, i) {
    html += '<div class="standings-row ' + (i===0?'top':'') + '" style="' + (i%2===0?'background:rgba(255,255,255,0.01)':'') + '"><div style="width:28px;font-size:12px;font-weight:700;color:' + (i===0?'var(--gold)':'var(--g500)') + '">' + r.pos + '</div><div style="flex:1;font-size:13px;font-weight:' + (i===0?800:600) + ';color:' + (i===0?'var(--text)':'var(--text-dim)') + '">' + r.p + '</div><div style="width:56px;text-align:center;font-size:13px;font-weight:700">' + r.pts + '</div><div style="width:36px;text-align:center;font-size:12px;color:' + (r.w>0?'var(--s-green)':'var(--g500)') + ';font-weight:700">' + r.w + '</div><div style="width:40px;text-align:center;font-size:12px;color:var(--text-muted)">' + r.t10 + '</div><div style="width:64px;text-align:right;font-size:12px;color:var(--gold);font-weight:600">' + r.earn + '</div></div>';
  });
  return html;
}

// ============================================
// RENDER SCHEDULE
// ============================================
let schedFilter = 'all';

function renderSchedule() {
  let html = '<div class="filter-bar">';
  ['all','pga','dpw','lpga'].forEach(function(t) {
    html += '<button class="filter-btn ' + (schedFilter===t?'active':'') + '" onclick="schedFilter=\'' + t + '\';renderApp()">' + (t==='all'?'All':TOURS.find(function(x){return x.id===t})?.short||t) + '</button>';
  });
  html += '</div>';

  if (scheduleLoading) return html + '<div style="text-align:center;padding:40px 20px"><div style="font-size:14px;font-weight:700;color:var(--text-dim)">Loading schedule...</div></div>';
  if (scheduleError || scheduleData.length === 0) {
    if (!scheduleFetched) fetchESPNSchedule();
    return html + '<div style="text-align:center;padding:40px 20px"><div style="font-size:13px;color:var(--text-muted)">' + (scheduleError || 'Loading schedule...') + '</div></div>';
  }

  const filtered = schedFilter === 'all' ? scheduleData : scheduleData.filter(function(s) { return s.tour === schedFilter; });
  if (filtered.length === 0) return html + '<div style="text-align:center;padding:40px 20px;font-size:13px;color:var(--text-muted)">No events found</div>';

  filtered.forEach(function(s) {
    html += '<div class="sched-card ' + (s.live?'live':'') + '"><div style="display:flex;justify-content:space-between;align-items:flex-start"><div><div style="display:flex;align-items:center;gap:8px"><span style="font-size:16px;font-weight:800">' + s.event + '</span>' + (s.live?'<span class="badge badge-live">LIVE</span>':'') + (s.major?'<span class="badge badge-major">MAJOR</span>':'') + '</div><div style="font-size:12px;color:var(--text-muted);margin-top:3px">' + s.course + '</div><div style="font-size:11px;color:var(--g700);margin-top:2px">' + s.dates + ' &middot; ' + (TOURS.find(function(x){return x.id===s.tour})?.name||'') + '</div></div><div style="text-align:right">' + (s.purse ? '<div style="font-size:13px;font-weight:700">' + s.purse + '</div>' : '') + (s.tv ? '<div style="font-size:10px;color:var(--text-muted);margin-top:3px">' + s.tv + '</div>' : '') + '</div></div></div>';
  });
  return html;
}

// ============================================
// MAIN RENDER
// ============================================
let _renderTimeout = null;
function renderApp() {
  if (_renderTimeout) clearTimeout(_renderTimeout);
  _renderTimeout = setTimeout(_doRender, 16);
}

function _doRender() {
  const app = document.getElementById('app');
  if (!app) return;
  let html = '<div style="padding:10px 0">';

  const wb = document.getElementById('watchBar');
  if (wb) {
    if (TOURNAMENT && TOURNAMENT.broadcast && TOURNAMENT.status && !TOURNAMENT.status.toLowerCase().includes('scheduled')) {
      wb.style.display = 'flex';
      document.getElementById('watchChannel').textContent = TOURNAMENT.broadcast;
      document.getElementById('watchEvent').textContent = '- ' + TOURNAMENT.name + ' ' + TOURNAMENT.status;
    } else wb.style.display = 'none';
  }

  switch(currentTab) {
    case 0: html += renderHome(); break;
    case 1: html += renderScores(); break;
    case 2: html += renderNews(); break;
    case 3: html += renderInsights(); break;
    case 4: html += renderBlog(); break;
    case 5: html += renderStandings(); break;
    case 6: html += renderSchedule(); break;
  }

  html += '</div>';
  app.innerHTML = html;

  // Bind article click handlers after DOM update
  document.querySelectorAll('.article-card').forEach(function(el) {
    // Find the article data for this card
    const titleEl = el.querySelector('.article-card-title');
    if (!titleEl) return;
    const title = titleEl.textContent;
    const allArticles = newsArticles.concat(blogArticles).concat(bettingArticles);
    const match = allArticles.find(function(a) { return a.title === title; });
    if (match) el._article = match;
  });

  // Bind home story clicks
  app.querySelectorAll('[onclick*="openArticleDetail"]').forEach(function(el) {
    // Already bound via inline - handled by _article property
  });
}

// ============================================
// INIT
// ============================================
fetchESPNScores(currentScoresTour);
fetchAllArticles();
fetchESPNSchedule();
startAutoRefresh();

// URL routing for /article/slug
const pathMatch = window.location.pathname.match(/^\/article\/(.+)/);
if (pathMatch) {
  const slug = decodeURIComponent(pathMatch[1]);
  currentTab = 2;
  (async function() {
    try {
      const { data } = await sb.from('articles').select('*').eq('slug', slug).limit(1);
      if (data?.[0]) {
        currentArticle = data[0];
        renderNav();
        renderApp();
      }
    } catch(e) { console.error('Article load error:', e); }
  })();
}

renderNav();
renderApp();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js').catch(function() {});
}
</script>
</body>
</html>
