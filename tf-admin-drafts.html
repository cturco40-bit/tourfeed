<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script async src="https://platform.twitter.com/widgets.js" charset="utf-8"></script>
  <meta name="robots" content="noindex, nofollow">
  <title>TF Drafts</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'DM Sans',-apple-system,sans-serif; background:#111927; color:#fff; min-height:100vh; }
    .login { display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; padding:20px; }
    .login input { padding:12px 16px; border-radius:8px; border:1px solid #243044; background:#1B2538; color:#fff; font-size:14px; width:280px; font-family:inherit; outline:none; }
    .login input:focus { border-color:#2D8F6F; }
    .login button { margin-top:10px; padding:10px 24px; background:#2D8F6F; border:none; border-radius:8px; color:#fff; font-weight:700; font-size:14px; cursor:pointer; font-family:inherit; }
    .container { max-width:600px; margin:0 auto; padding:20px; display:none; }
    .header { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; padding-bottom:14px; border-bottom:1px solid rgba(255,255,255,0.06); }
    .title { font-size:18px; font-weight:800; }
    .count { font-size:13px; color:#868E96; }
    .refresh { background:none; border:1px solid #243044; border-radius:6px; padding:6px 14px; color:#2D8F6F; font-size:12px; font-weight:700; cursor:pointer; font-family:inherit; }
    .draft { border-bottom:1px solid rgba(255,255,255,0.04); padding:16px 0; }
    .draft:last-child { border-bottom:none; }
    .draft-source { font-size:10px; font-weight:700; letter-spacing:1.5px; color:#868E96; margin-bottom:6px; text-transform:uppercase; }
    .draft-text { font-size:14px; line-height:1.6; color:#CED4DA; white-space:pre-wrap; word-break:break-word; }
    .draft-time { font-size:11px; color:#495057; margin-top:6px; }
    .draft-actions { display:flex; gap:8px; margin-top:10px; }
    .btn-approve { padding:8px 20px; background:#2D8F6F; border:none; border-radius:6px; color:#fff; font-weight:700; font-size:12px; cursor:pointer; font-family:inherit; }
    .btn-reject { padding:8px 20px; background:transparent; border:1px solid #495057; border-radius:6px; color:#868E96; font-weight:700; font-size:12px; cursor:pointer; font-family:inherit; }
    .btn-approve:hover { background:#34A37E; }
    .btn-reject:hover { border-color:#FF6B6B; color:#FF6B6B; }
    .draft-edit { width:100%; background:#1B2538; border:1px solid #243044; border-radius:6px; color:#CED4DA; font-size:14px; line-height:1.6; padding:10px 12px; font-family:inherit; resize:vertical; outline:none; }
    .draft-edit:focus { border-color:#2D8F6F; }
    .empty { text-align:center; padding:60px 20px; color:#495057; font-size:14px; }
    .status { padding:8px 12px; border-radius:6px; margin-top:8px; font-size:12px; font-weight:600; }
    .status-ok { background:rgba(45,212,160,0.1); color:#2DD4A0; }
    .status-err { background:rgba(255,107,107,0.1); color:#FF6B6B; }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div class="login" id="loginScreen">
    <div style="font-size:20px;font-weight:900;margin-bottom:20px"><span style="color:#fff">TOUR</span><span style="color:#D4A853">FEED</span></div>
    <input type="password" id="passInput" placeholder="Enter access code" onkeydown="if(event.key==='Enter')doLogin()">
    <button onclick="doLogin()">Access Drafts</button>
  </div>

  <div class="container" id="main">
    <div class="header">
      <div>
        <div class="title">Tweet Drafts</div>
        <div class="count" id="draftCount">Loading...</div>
      </div>
      <button class="refresh" onclick="loadDrafts()">Refresh</button>
    </div>
    <div id="draftList"></div>
  </div>

  <script>
    const ACCESS_CODE = 'Gr33nJack3t!';

    function doLogin() {
      const code = document.getElementById('passInput').value;
      if (code === ACCESS_CODE) {
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('main').style.display = 'block';
        loadDrafts();
      } else {
        document.getElementById('passInput').style.borderColor = '#FF6B6B';
      }
    }

    async function loadDrafts() {
      const list = document.getElementById('draftList');
      const count = document.getElementById('draftCount');
      list.innerHTML = '<div class="empty">Loading drafts...</div>';

      try {
        const res = await fetch('/.netlify/functions/draft-tweet');
        const data = await res.json();
        const drafts = data.drafts || [];

        count.textContent = drafts.length + ' pending';

        if (drafts.length === 0) {
          list.innerHTML = '<div class="empty">No pending drafts. Tweets are being generated by the cron jobs and will appear here for approval.</div>';
          return;
        }

        list.innerHTML = drafts.map(d => {
          const time = new Date(d.created).toLocaleString();
          // Extract twitter URL from draft text for preview
          const tweetUrlMatch = d.text.match(/https?:\/\/twitter\.com\/\w+\/status\/\d+/);
          const tweetEmbed = tweetUrlMatch
            ? '<div style="margin-bottom:10px;padding:10px;background:#1B2538;border-radius:8px;border-left:3px solid #4A90D9"><div style="font-size:10px;color:#4A90D9;margin-bottom:4px">QUOTING</div><a href="' + tweetUrlMatch[0] + '" target="_blank" style="font-size:12px;color:#868E96;word-break:break-all">' + tweetUrlMatch[0] + '</a><blockquote class="twitter-tweet" data-theme="dark" data-conversation="none"><a href="' + tweetUrlMatch[0] + '"></a></blockquote></div>'
            : '';
          return `
            <div class="draft" id="draft-${d.id}">
              <div class="draft-source">${d.source || 'auto'}</div>
              ${tweetEmbed}
              <div style="font-size:10px;color:#495057;margin-bottom:4px">YOUR TWEET</div>
              <textarea class="draft-edit" id="edit-${d.id}" rows="4">${d.text}</textarea>
              <div style="font-size:11px;color:#495057;margin-top:4px;text-align:right"><span id="chars-${d.id}">${d.text.length}</span>/280</div>
              <div class="draft-time">${time}</div>
              <div class="draft-actions">
                <button class="btn-approve" onclick="approveDraft(${d.id})">Approve & Post</button>
                <button class="btn-reject" onclick="rejectDraft(${d.id})">Reject</button>
              </div>
            </div>
          `;
        }).join('');

        // Load Twitter embeds
        if (window.twttr && window.twttr.widgets) window.twttr.widgets.load();

        // Add character counters
        drafts.forEach(d => {
          const textarea = document.getElementById('edit-' + d.id);
          const counter = document.getElementById('chars-' + d.id);
          if (textarea && counter) {
            textarea.addEventListener('input', () => {
              const len = textarea.value.length;
              counter.textContent = len;
              counter.style.color = len > 280 ? '#FF6B6B' : '#495057';
            });
          }
        });
      } catch(e) {
        list.innerHTML = '<div class="empty">Error loading drafts</div>';
      }
    }

    async function approveDraft(id) {
      const el = document.getElementById('draft-' + id);
      const textarea = document.getElementById('edit-' + id);
      const editedText = textarea ? textarea.value.trim() : '';
      const actions = el.querySelector('.draft-actions');

      if (editedText.length > 280) {
        actions.innerHTML = '<div class="status status-err">Over 280 characters — trim it down</div>';
        return;
      }
      if (!editedText) {
        actions.innerHTML = '<div class="status status-err">Tweet is empty</div>';
        return;
      }

      actions.innerHTML = '<div class="status">Posting...</div>';

      try {
        // Post the edited version directly instead of the original
        const postRes = await fetch('/.netlify/functions/post-tweet', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text: editedText }),
        });
        // Remove from drafts
        await fetch('/.netlify/functions/draft-tweet?action=reject&id=' + id);
        const data = await postRes.json();

        if (data.success) {
          actions.innerHTML = '<div class="status status-ok">Posted!</div>';
          textarea.disabled = true;
          textarea.style.opacity = '0.4';
        } else {
          actions.innerHTML = '<div class="status status-err">Failed: ' + (data.error || 'unknown') + '</div>';
        }
      } catch(e) {
        actions.innerHTML = '<div class="status status-err">Error: ' + e.message + '</div>';
      }
    }

    async function rejectDraft(id) {
      const el = document.getElementById('draft-' + id);
      try {
        await fetch('/.netlify/functions/draft-tweet?action=reject&id=' + id);
        el.style.opacity = '0.3';
        el.querySelector('.draft-actions').innerHTML = '<div class="status" style="color:#D4A853">Rejected</div>';
      } catch(e) {}
    }

    function escHtml(str) {
      return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
    }

    // Auto-refresh every 30 seconds
    setInterval(loadDrafts, 30000);
  </script>
</body>
</html>
