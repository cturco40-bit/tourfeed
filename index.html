    .nav-btn { padding:12px 16px; border-radius:0; border:none; border-bottom:2px solid transparent; background:transparent; color:var(--muted); font-size:12px; font-weight:600; cursor:pointer; white-space:nowrap; font-family:inherit; transition:all 0.15s; letter-spacing:0.5px; text-transform:uppercase; }
    .nav-btn:hover { color:var(--text); }
    .nav-btn.active { color:var(--green); border-bottom-color:var(--green); font-weight:700; }

    @keyframes tickerScroll { 0%{transform:translateX(0)} 100%{transform:translateX(-50%)} }

function getSiteState() {
  if (TOURNAMENT && PLAYERS.length > 0) {
    if (TOURNAMENT.state === 'in' || TOURNAMENT.stateName === 'STATUS_IN_PROGRESS') return 'live';
    if (TOURNAMENT.state === 'post' || TOURNAMENT.stateName === 'STATUS_FINAL') return 'post';
    if (TOURNAMENT.state === 'pre') return 'pre';
  }
  return 'between';
}

// ============================================
// UTILITY FUNCTIONS
// ============================================
function esc(str) {
  if (!str) return '';
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/`/g,'&#96;').replace(/\$/g,'&#36;');
}
function formatOdds(o) { if (!o) return ''; o = String(o); return o.startsWith('+') || o.startsWith('-') ? o : '+' + o; }

function timeAgo(dateStr) {
  if (!dateStr) return '';
  const mins = Math.round((Date.now() - new Date(dateStr).getTime()) / 60000);
  if (isNaN(mins) || mins < 0) return '';
  if (mins < 60) return mins + 'm ago';
  if (mins < 1440) return Math.round(mins/60) + 'h ago';
  const days = Math.round(mins/1440);
  if (days < 7) return days + 'd ago';
  return new Date(dateStr).toLocaleDateString('en-US', {month:'short', day:'numeric'});
}

function readTime(text) {
  if (!text) return '1 min';
  const words = text.replace(/<[^>]+>/g, '').split(/\s+/).length;
  return Math.max(1, Math.ceil(words / 200)) + ' min read';
}

function tagClass(tag) {
  const t = (tag || '').toUpperCase();
  if (t === 'RECAP' || t === 'TOURNAMENT') return 'tag-recap';
  if (t === 'BETTING') return 'tag-betting';
  if (t === 'BREAKING') return 'tag-breaking';
  if (t === 'PREVIEW') return 'tag-preview';
  if (t === 'ANALYSIS') return 'tag-analysis';
  if (t === 'MAJOR') return 'tag-major';
  if (t === 'INJURY') return 'tag-injury';
  if (t === 'NEWS' || t === 'TOUR NEWS') return 'tag-news';
  return 'tag-default';
}

function tagColor(tag) {
  const t = (tag || '').toUpperCase();
  if (t === 'RECAP' || t === 'TOURNAMENT') return 'var(--green)';
  if (t === 'BETTING' || t === 'ANALYSIS') return 'var(--gold)';
  if (t === 'PREVIEW') return 'var(--green-light)';
  if (t === 'BREAKING' || t === 'INJURY') return 'var(--red)';
  if (t === 'MAJOR') return '#D4A853';
  if (t === 'LIV GOLF') return 'var(--gold)';
  if (t === 'LPGA') return '#C44D8E';
  if (t === 'DP WORLD') return '#3A6EA5';
  return 'var(--muted)';
}

function countryFlag(input) {
  if (!input) return '<span style="font-size:10px;color:var(--muted)">-</span>';
  let code = input.trim();
  if (code.length === 2) {
    code = code.toLowerCase();
  } else {
    code = (COUNTRY_MAP[code.toLowerCase()] || '').toLowerCase();
  }
  if (!code || code.length !== 2) return '<span style="font-size:10px;color:var(--muted)">-</span>';
  return '<img src="https://flagcdn.com/20x15/' + code + '.png" width="20" height="15" style="vertical-align:middle;border-radius:2px" alt="' + code.toUpperCase() + '" onerror="this.style.display=\'none\'">';
}

function formatPurse(purse) {
  const amt = typeof purse === 'number' ? purse : (purse?.amount || 0);
  if (!amt) return '';
  if (amt >= 1e6) return '$' + (amt/1e6).toFixed(amt%1e6===0?0:1) + 'M';
  if (amt >= 1e3) return '$' + (amt/1e3).toFixed(0) + 'K';
  return '$' + amt;
}

function scoreClass(s) {
  if (!s) return '';
  return s.startsWith('+') ? 'score-over' : s === 'E' ? 'score-even' : 'score-under';
}

function formatMovement(m) {
  if (m === undefined || m === null || m === 0) return '-';
  return m < 0 ? '\u2191' + Math.abs(m) : '\u2193' + m;
}

async function fetchESPNScores(tour) {
  const sport = ESPN_SPORTS[tour];
  if (!sport) {
    TOURNAMENT = null; PLAYERS = [];
    scoresError = 'No data source for this tour';
    scoresLoading = false;
    renderApp();
    return;
  }

  scoresLoading = true;
  scoresError = null;
  renderApp();

  try {
    const url = 'https://site.api.espn.com/apis/site/v2/sports/' + sport + '/scoreboard';
    const res = await fetch(url);
    if (!res.ok) throw new Error('ESPN ' + res.status);
    const data = await res.json();

    const event = data.events?.[0];
    if (!event) {
      scoresError = 'No active tournament';
      scoresLoading = false;
      TOURNAMENT = null; PLAYERS = [];
      renderApp();
      return;
    }

    const comp = event.competitions?.[0];
    if (!comp) throw new Error('No competition data');

    const st = comp.status || {};
    const period = st.period || 1;
    const coursePar = 72;
    const name = event.name || event.shortName || '';
    const isMajor = /masters|pga championship|u\.?s\.? open|open championship|the open/i.test(name);

    TOURNAMENT = {
      name: event.shortName || event.name || 'Tournament',
      course: comp.venue?.fullName || comp.venue?.shortName || '',
      dates: '',
      purse: formatPurse(comp.purse),
      status: st.type?.description || st.type?.shortDetail || 'In Progress',
      round: period,
      par: coursePar,
      broadcast: comp.broadcast?.names?.join(' / ') || comp.geoBroadcasts?.map(function(g){return g.media?.shortName}).filter(Boolean).join(' / ') || '',
      tour: TOURS.find(function(t){return t.id === tour})?.name || '',
      is_major: isMajor,
      eventId: event.id,
      stateName: (st.type?.name || '').toUpperCase(),
      state: st.type?.state || '',
    };

    try {
      const d = new Date(event.date);
      const mo = d.toLocaleString('en-US',{month:'short'});
      const day = d.getDate();
      const end = new Date(d); end.setDate(day + 3);
      TOURNAMENT.dates = mo + ' ' + day + '-' + end.getDate() + ', ' + d.getFullYear();
    } catch(e) {}

    const competitors = comp.competitors || [];
    PLAYERS = competitors.map(function(c) {
      const ath = c.athlete || {};
      const ls = c.linescores || [];

      let scoreDisp = '';
      if (typeof c.score === 'string') scoreDisp = c.score;
      else if (typeof c.score === 'number') scoreDisp = c.score === 0 ? 'E' : (c.score > 0 ? '+' + c.score : '' + c.score);
      else if (c.score?.displayValue) scoreDisp = c.score.displayValue;
      if (scoreDisp === '0' || scoreDisp === '+0') scoreDisp = 'E';

      const flagAlt = ath.flag?.alt || '';
      const citizenship = ath.citizenship || '';
      const flag = countryFlag(citizenship || flagAlt);

      const curRoundLS = ls[period - 1];
      const holesPlayed = curRoundLS?.linescores?.length || 0;
      let thruDisp = '';
      if (holesPlayed === 0) thruDisp = '-';
      else if (holesPlayed >= 18) thruDisp = 'F';
      else thruDisp = holesPlayed.toString();

      if (c.status?.thru != null) {
        thruDisp = c.status.thru >= 18 ? 'F' : c.status.thru.toString();
      } else if (c.status?.displayValue) {
        thruDisp = c.status.displayValue;
      } else {
        const sd = c.status?.type?.shortDetail || '';
        const thruMatch = sd.match(/thru\s*(\d+)/i);
        if (thruMatch) thruDisp = thruMatch[1];
        else if (/final|complete/i.test(sd)) thruDisp = 'F';
      }

      let todayDisp = '';
      if (curRoundLS) {
        const dv = curRoundLS.displayValue;
        if (dv && dv !== '-') todayDisp = dv;
      }

      const roundVal = function(idx) {
        const r = ls[idx];
        if (!r) return null;
        const holes = r.linescores?.length || 0;
        if (holes >= 18) return r.value || null;
        return null;
      };

      const statusName = (c.status?.type?.name || '').toUpperCase();
      const statusDesc = (c.status?.type?.description || '').toLowerCase();
      const isCut = statusName.includes('CUT') || statusDesc.includes('cut') || scoreDisp === 'CUT';
      const isWD = statusName.includes('WD') || statusName.includes('WITHDRAW') || statusDesc.includes('wd') || scoreDisp === 'WD';
      const isDQ = statusName.includes('DQ') || statusDesc.includes('disqualif') || scoreDisp === 'DQ';

      return {
        pos: '', name: ath.displayName || 'Unknown', c: flag,
        score: isCut ? 'MC' : isWD ? 'WD' : isDQ ? 'DQ' : scoreDisp,
        today: isCut || isWD || isDQ ? '-' : todayDisp,
        thru: thruDisp,
        r1: roundVal(0), r2: roundVal(1), r3: roundVal(2), r4: roundVal(3),
        sg: '', ch: '',
        status: isCut ? 'cut' : isWD ? 'wd' : isDQ ? 'dq' : 'active',
        holes: [], athleteId: ath.id || c.id, sortOrder: c.order || c.sortOrder || 999,
      };
    });

    PLAYERS.sort(function(a,b) { return a.sortOrder - b.sortOrder; });

    const activePlayers = PLAYERS.filter(function(p) { return p.status === 'active'; });
    activePlayers.forEach(function(p, i) {
      if (i > 0 && activePlayers[i-1].score === p.score) p.pos = activePlayers[i-1].pos;
      else p.pos = 'T' + (i + 1);
    });
    activePlayers.forEach(function(p, i) {
      const isTied = (i > 0 && activePlayers[i-1].score === p.score) ||
                     (i < activePlayers.length - 1 && activePlayers[i+1].score === p.score);
      if (!isTied) p.pos = p.pos.replace('T', '');
    });
    PLAYERS.forEach(function(p) {
      if (p.status === 'cut') p.pos = 'MC';
      else if (p.status === 'wd') p.pos = 'WD';
      else if (p.status === 'dq') p.pos = 'DQ';
    });

    lastFetchTime = new Date();
    scoresLoading = false;
    scoresError = null;
    renderApp();

    // Enrich with status data
    const stState = comp.status?.type?.state || '';
    if (stState !== 'in' && stState !== 'pre') { renderApp(); return; }

    const league = sport.replace('golf/', '') || 'pga';
    const eventId = event.id;
    const compId = comp.id || eventId;
    try {
      const allStatuses = [];
      for (let i = 0; i < PLAYERS.length; i += 20) {
        const batch = PLAYERS.slice(i, i + 20).map(function(p) {
          return fetch('https://sports.core.api.espn.com/v2/sports/golf/leagues/' + league + '/events/' + eventId + '/competitions/' + compId + '/competitors/' + p.athleteId + '/status')
            .then(function(r) { return r.ok ? r.json() : null; }).catch(function() { return null; });
        });
        const results = await Promise.all(batch);
        allStatuses.push.apply(allStatuses, results);
      }
      allStatuses.forEach(function(st, i) {
        if (!st || !PLAYERS[i]) return;
        const p = PLAYERS[i];
        if (st.position?.displayName) p.pos = st.position.displayName;
        if (st.thru != null) {
          if (st.type?.state === 'pre' || st.thru === 0) {
            if (st.teeTime) {
              const t = new Date(st.teeTime);
              p.thru = t.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
            } else p.thru = '-';
          } else if (st.thru >= 18) p.thru = 'F';
          else p.thru = st.thru.toString();
        }
        const stName = (st.type?.name || '').toUpperCase();
        if (stName.includes('CUT')) { p.status = 'cut'; p.pos = 'MC'; }
        else if (stName.includes('WD') || stName.includes('WITHDRAW')) { p.status = 'wd'; p.pos = 'WD'; }
        else if (stName.includes('DQ')) { p.status = 'dq'; p.pos = 'DQ'; }
      });
      renderApp();
    } catch(e) { console.error('Status enrichment error:', e); }
    return;
  } catch(err) {
    console.error('ESPN fetch error:', err);
    scoresError = 'Unable to load scores';
    scoresLoading = false;
  }
  renderApp();
}

async function fetchScorecard(playerIdx) {
  const p = PLAYERS[playerIdx];
  if (!p || !p.athleteId || !TOURNAMENT?.eventId) return;
  const round = TOURNAMENT.round;
  const cacheKey = p.athleteId + '-' + round;
  if (scorecardCache[cacheKey]) {
    PLAYERS[playerIdx].holes = scorecardCache[cacheKey].holes;
    PAR = scorecardCache[cacheKey].par.length ? scorecardCache[cacheKey].par : PAR;
    renderApp();
    return;
  }
  try {
    const sport = ESPN_SPORTS[currentScoresTour];
    const res = await fetch('https://site.api.espn.com/apis/site/v2/sports/' + sport + '/scoreboard/' + TOURNAMENT.eventId + '/competitors/' + p.athleteId + '/scorecard');
    if (!res.ok) return;
    const data = await res.json();
    const rounds = data.rounds || data.scorecard?.rounds || [];
    const target = rounds.find(function(r) { return r.period === round || r.roundNumber === round; }) || rounds[rounds.length-1];
    if (target) {
      const holeData = target.holes || target.linescores || [];
      const holes = holeData.map(function(h) { return h.score ?? h.value; });
      const par = holeData.map(function(h) { return h.par ?? h.parValue ?? 4; });
      if (holes.length === 18 && holes.every(function(h) { return typeof h === 'number'; })) {
        PLAYERS[playerIdx].holes = holes;
        PAR = par;
        scorecardCache[cacheKey] = { holes: holes, par: par };
        renderApp();
      }
    }
  } catch(e) {}
}

let standingsLive = {};
let standingsLoading = false;
let standingsError = null;
let standingsFetched = {};
let standingsFilter = 'pga';

async function fetchESPNStandings(tour) {
  if (standingsFetched[tour]) return;
  const sport = ESPN_SPORTS[tour];
  if (!sport) { standingsError = 'Standings not available'; renderApp(); return; }
  standingsLoading = true;
  standingsError = null;
  renderApp();
  try {
    const res = await fetch('https://site.api.espn.com/apis/site/v2/sports/' + sport + '/standings');
    if (!res.ok) throw new Error('ESPN ' + res.status);
    const data = await res.json();
    const children = data.children || data.standings || [];
    const standing = children[0] || data;
    const entries = standing.entries || standing.standings?.[0]?.entries || [];
    standingsLive[tour] = entries.map(function(e, i) {
      const stats = {};
      (e.stats || []).forEach(function(s) { stats[s.name || s.abbreviation] = s.displayValue || s.value; });
      return {
        pos: i + 1,
        p: e.athlete?.displayName || e.team?.displayName || 'Unknown',
        pts: stats.points || stats.cupPoints || stats.totalPoints || '-',
        w: parseInt(stats.wins || stats.gamesWon || '0') || 0,
        t10: parseInt(stats.top10 || stats.top10Finishes || '0') || 0,
        earn: stats.earnings || stats.totalEarnings || stats.money || '-',
      };
    });
    standingsFetched[tour] = true;
    standingsLoading = false;
  } catch(e) {
    standingsError = 'Standings unavailable';
    standingsLoading = false;
  }
  renderApp();
}

// ESPN SCHEDULE
// ============================================
let scheduleData = [];
let scheduleLoading = false;
let scheduleError = null;
let scheduleFetched = false;

async function fetchESPNSchedule() {
  if (scheduleFetched && scheduleData.length > 0) return;
  scheduleLoading = true;
  scheduleError = null;
  renderApp();
  try {
    const tours = [
      { id: 'pga', sport: 'golf/pga' },
      { id: 'lpga', sport: 'golf/lpga' },
      { id: 'dpw', sport: 'golf/eur' },
    ];
    const allEvents = [];
    for (const tour of tours) {
      try {
        const res = await fetch('https://site.api.espn.com/apis/site/v2/sports/' + tour.sport + '/scoreboard?dates=' + new Date().getFullYear());
        if (!res.ok) continue;
        const data = await res.json();
        (data.events || []).forEach(function(ev) {
          const comp = ev.competitions?.[0];
          const st = comp?.status?.type;
          const isLive = st?.name === 'STATUS_IN_PROGRESS';
          const isMajor = /masters|pga championship|u\.?s\.? open|open championship|the open/i.test(ev.name || '');
          let dateStr = '';
          try {
            const d = new Date(ev.date);
            const mo = d.toLocaleString('en-US',{month:'short'});
            const day = d.getDate();
            const end = new Date(d); end.setDate(day+3);
            dateStr = mo + ' ' + day + '-' + end.getDate();
          } catch(e) {}
          allEvents.push({
            event: ev.shortName || ev.name || '',
            course: comp?.venue?.fullName || '',
            dates: dateStr,
            purse: formatPurse(comp?.purse),
            tour: tour.id,
            tv: comp?.broadcast?.names?.join(' / ') || comp?.geoBroadcasts?.map(function(g){return g.media?.shortName}).filter(Boolean).join(' / ') || '',
            live: isLive, major: isMajor, startDate: ev.date,
          });
        });
      } catch(e) { continue; }
    }
    allEvents.sort(function(a,b) { return new Date(a.startDate) - new Date(b.startDate); });
    scheduleData = allEvents;
    scheduleFetched = true;
    scheduleLoading = false;
  } catch(e) {
    scheduleError = 'Unable to load schedule';
    scheduleLoading = false;
  }
  renderApp();
}

function updateSEO(opts) {
  document.title = opts.title || 'TourFeed \u2014 Your Daily Golf Fix';
  var desc = document.querySelector('meta[name="description"]');
  if (desc) desc.setAttribute('content', opts.description || 'Live golf scores, betting picks, and original analysis. PGA Tour, LIV, DP World, LPGA \u2014 all in one feed.');
  var canon = document.querySelector('link[rel="canonical"]');
  if (canon) canon.setAttribute('href', opts.canonical || 'https://tourfeed.co/');
  // Article JSON-LD
  var existing = document.getElementById('jsonld-article');
  if (existing) existing.remove();
  if (opts.article) {
    var s = document.createElement('script');
    s.type = 'application/ld+json';
    s.id = 'jsonld-article';
    s.textContent = JSON.stringify({
      '@context': 'https://schema.org',
      '@type': 'Article',
      'headline': opts.article.title,
      'datePublished': opts.article.published_at || '',
      'author': {'@type': 'Organization', 'name': 'TourFeed'},
      'publisher': {'@type': 'Organization', 'name': 'TourFeed', 'url': 'https://tourfeed.co'}
    });
    document.head.appendChild(s);
  }
}

function switchTab(i) {
  currentTab = i;
  expandedCard = null;
  currentArticle = null;
  newsShowCount = 10;
  blogShowCount = 10;
  renderNav();
  if (i === 0 || i === 2 || i === 3) fetchAllArticles();

function renderScoreTicker() {
  var ticker = document.getElementById('scoreTicker');
  var inner = document.getElementById('scoreTickerInner');
  if (!ticker || !inner) return;
  var active = PLAYERS ? PLAYERS.filter(function(p) { return p.status === 'active'; }) : [];
  var sState = getSiteState();
  if (sState !== 'live') { ticker.style.display = 'none'; return; }
  ticker.style.display = 'block';
  var items = '';
  items += '<span class="ticker-live-badge">LIVE</span>';
  items += '<span class="ticker-item" style="color:#D4A853;font-weight:700">' + esc(TOURNAMENT.name) + ' &mdash; R' + TOURNAMENT.round + '</span>';
  active.slice(0, 15).forEach(function(p) {
    var sc = p.score.startsWith('+') ? 'color:var(--s-red)' : p.score === 'E' ? 'color:#999' : 'color:#4CAF50';
    items += '<span class="ticker-item">' + p.c + ' <span class="ticker-name">' + esc(p.name) + '</span> <span class="ticker-score" style="' + sc + '">' + p.score + '</span>';
    if (p.thru && p.thru !== '-' && p.thru !== 'F') items += ' <span style="color:#666;font-size:10px">thru ' + p.thru + '</span>';
    items += '</span>';
  });
  // Duplicate for seamless scroll
  inner.innerHTML = items + items;
}

let popupClosed = false;

function showPopup() {
  if (popupClosed || localStorage.getItem('tf-subscribed') || localStorage.getItem('tf-popup-closed')) return;
  var ep = document.getElementById('emailPopup');
  ep.style.display = 'block';
  ep.classList.add('show');
}
function closePopup() {
  var ep = document.getElementById('emailPopup');
  ep.classList.remove('show');
  ep.style.display = 'none';
  popupClosed = true;
  localStorage.setItem('tf-popup-closed', '1');
}
async function doSubscribe(email, successEl, errorEl) {
  if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
    if (errorEl) errorEl.textContent = 'Enter a valid email address';
    return;
  }
  if (BEEHIIV_PUB_ID && BEEHIIV_API_KEY) {
    try {
      var res = await fetch('https://api.beehiiv.com/v2/publications/' + BEEHIIV_PUB_ID + '/subscriptions', {
        method: 'POST',
        headers: { 'Authorization': 'Bearer ' + BEEHIIV_API_KEY, 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: email, reactivate_existing: true, send_welcome_email: true }),
      });
      if (!res.ok) throw new Error('Subscribe failed');
    } catch(e) {
      if (errorEl) errorEl.textContent = 'Something went wrong. Try again.';
      return;
    }
  }
  localStorage.setItem('tf-subscribed', '1');
  if (successEl) successEl();
}

function subscribeEmail() {
  var input = document.getElementById('emailInput');
  var email = input.value;
  var popup = document.getElementById('emailPopup');
  doSubscribe(email, function() {
    popup.innerHTML = '<div style="text-align:center;padding:12px 0"><div style="font-size:20px;margin-bottom:6px;color:var(--green)">&#10003;</div><div style="font-family:DM Sans,sans-serif;font-size:16px;font-weight:700;color:var(--text)">You\'re in.</div><div style="font-size:12px;color:var(--muted);margin-top:4px">We\'ll send you the good stuff.</div></div>';
    setTimeout(function() { popup.classList.remove('show'); popup.style.display='none'; }, 2500);
  });
}
function subscribeInline(inputId) {
  var input = document.getElementById(inputId);
  if (!input) return;
  var email = input.value;
  var parent = input.parentElement;
  doSubscribe(email, function() {
    parent.innerHTML = '<div style="font-family:DM Sans,sans-serif;font-size:15px;font-weight:700;color:#fff;padding:8px 0">You\'re in. Welcome to TourFeed.</div>';
  });
}

function shareArticle(title, slug) {
  const url = slug ? 'https://tourfeed.co/article/' + slug : 'https://tourfeed.co';
  if (navigator.share) {
    navigator.share({ title: title, url: url });
  } else {
    navigator.clipboard.writeText(url);
    alert('Link copied!');
  }
}

function shareTwitter(title, slug) {
  const url = slug ? 'https://tourfeed.co/article/' + slug : 'https://tourfeed.co';
  window.open('https://twitter.com/intent/tweet?text=' + encodeURIComponent(title) + '&url=' + encodeURIComponent(url), '_blank');
}

// Store articles by ID for click handling
var _articleCache = {};

function clickArticle(id) {
  var art = _articleCache[id];
  if (art) {
    openArticleDetail(art);
  } else {
    // Fallback: search all loaded articles
    var all = newsArticles.concat(blogArticles).concat(bettingArticles);
    var match = all.find(function(a) { return String(a.id) === String(id); });
    if (match) openArticleDetail(match);
    else console.warn('Article not found:', id, 'Cache keys:', Object.keys(_articleCache));
  }
}

function openArticleDetail(article) {
  currentArticle = article;
  if (article.slug) history.pushState(null, '', '/article/' + article.slug);
  document.title = (article.title || 'Article') + ' | TourFeed';
  renderApp();
  window.scrollTo(0, 0);
}

function closeArticleDetail() {
  currentArticle = null;
  var seo = TAB_SEO[currentTab] || TAB_SEO[0];
  updateSEO({ title: seo.title, description: seo.description });
  history.pushState(null, '', '/');
  renderApp();
  window.scrollTo(0, 0);
}

function renderArticleDetail(a) {
  var tc = tagColor(a.tag);
  var rt = readTime(a.body);
  var dateStr = a.published_at ? new Date(a.published_at).toLocaleDateString('en-US', {month:'long', day:'numeric', year:'numeric'}) : '';
  var backLabel = currentTab === 2 ? 'News' : currentTab === 3 ? 'Insights' : currentTab === 4 ? 'Blog' : 'Back';
  var tagText = esc(a.tag || 'NEWS');
  var tClass = tagClass(a.tag);
  // SEO for article detail
  var plainDesc = (a.body || a.summary || '').replace(/<[^>]+>/g, '').slice(0, 155).trim();
  updateSEO({
    title: a.title + ' \u2014 TourFeed',
    description: plainDesc,
    canonical: 'https://tourfeed.co/article/' + (a.slug || ''),
    article: { title: a.title, published_at: a.published_at }
  });

  var html = '<div class="article-detail">';

  // Back button
  html += '<button onclick="closeArticleDetail()" style="background:none;border:none;color:var(--green);font-size:13px;font-weight:700;cursor:pointer;padding:12px 0;font-family:inherit;display:flex;align-items:center;gap:4px">&larr; ' + backLabel + '</button>';

  // Tag
  html += '<div style="margin-bottom:12px"><span class="tag ' + tClass + '">' + tagText + '</span></div>';

  // Headline
  html += '<h1 class="article-detail-title">' + esc(a.title) + '</h1>';

  // Meta line
  html += '<div class="article-detail-meta">';
  html += '<span style="font-weight:600;color:var(--dim)">By TourFeed Staff</span>';
  if (dateStr) html += '<span>&middot;</span><span>' + dateStr + '</span>';
  html += '<span>&middot;</span><span>' + rt + '</span>';
  html += '</div>';

  // Article body
  html += '<div class="article-detail-body">' + (a.body || '<p>' + esc(a.summary || '') + '</p>') + '</div>';

  // Share buttons
  var safeTitle = esc(a.title).replace(/'/g, '');
  var safeSlug = esc(a.slug || '');
  html += '<div class="share-row">';
  html += '<button class="share-btn" onclick="shareTwitter(\'' + safeTitle + '\',\'' + safeSlug + '\')">Share on X</button>';
  html += '<button class="share-btn" onclick="shareArticle(\'' + safeTitle + '\',\'' + safeSlug + '\')">Copy Link</button>';
  html += '</div>';

  // Email CTA
  if (!localStorage.getItem('tf-subscribed')) {
    html += '<div class="email-cta" style="margin:24px 0">';
    html += '<div class="email-cta-title">Get TourFeed in your inbox</div>';
    html += '<div class="email-cta-sub">Scores, recaps, and betting picks. Free, no spam.</div>';
    html += '<div class="email-cta-form">';
    html += '<input type="email" id="inlineEmail" placeholder="Your email">';
    html += '<button onclick="subscribeInline(\'inlineEmail\')">Subscribe</button>';
    html += '</div></div>';
  }

  // Related articles
  var allForRelated = newsArticles.concat(blogArticles).concat(bettingArticles);
  var related = allForRelated.filter(function(r) { return r.id !== a.id && r.title !== a.title; }).slice(0, 3);
  if (related.length > 0) {
    html += '<div style="margin-top:24px;padding-top:20px;border-top:1px solid var(--border)">';
    html += '<div style="font-family:DM Sans,sans-serif;font-size:13px;font-weight:700;letter-spacing:2px;color:var(--green);margin-bottom:12px;text-transform:uppercase">More From TourFeed</div>';
    related.forEach(function(r) { html += renderArticleRow(r); });
    html += '</div>';
  }

  html += '</div>';
  return html;
}

// ============================================
// SCORECARD RENDERER
// ============================================
function renderScorecard(p) {
  if (!p.holes || p.holes.length === 0) {
    const rounds = [p.r1, p.r2, p.r3, p.r4].filter(function(r) { return r !== null && r !== undefined; });
    const coursePar = TOURNAMENT?.par || 72;
    let html = '<div class="scorecard"><div class="scorecard-title">Round Scores &mdash; ' + p.name + '</div>';
    html += '<div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:8px">';
    rounds.forEach(function(r, i) {
      const diff = r - coursePar;
      const diffStr = diff === 0 ? 'E' : (diff > 0 ? '+' + diff : '' + diff);
      const color = diff < 0 ? '#1A6B3C' : diff > 0 ? 'var(--red)' : 'var(--muted)';
      html += '<div style="text-align:center;min-width:56px"><div style="font-size:9px;color:var(--muted);font-weight:600;letter-spacing:1px">R' + (i+1) + '</div><div style="font-size:22px;font-weight:800;margin-top:2px;color:var(--text)">' + r + '</div><div style="font-size:11px;font-weight:700;color:' + color + ';margin-top:1px">' + diffStr + '</div></div>';
    });
    if (rounds.length > 0) {
      html += '<div style="text-align:center;min-width:56px;border-left:1px solid var(--border);padding-left:12px"><div style="font-size:9px;color:var(--muted);font-weight:600;letter-spacing:1px">TOTAL</div><div style="font-size:22px;font-weight:800;margin-top:2px;color:var(--text)">' + rounds.reduce(function(a,b){return a+b;},0) + '</div><div style="font-size:11px;font-weight:700;color:' + (p.score.startsWith('+')?'var(--red)':p.score==='E'?'var(--muted)':'#1A6B3C') + ';margin-top:1px">' + p.score + '</div></div>';
    }
    html += '</div></div>';
    return html;
  }

  const front = p.holes.slice(0,9);
  const back = p.holes.slice(9);
  const frontPar = PAR.length >= 18 ? PAR.slice(0,9) : [4,4,4,3,4,3,4,5,4];
  const backPar = PAR.length >= 18 ? PAR.slice(9) : [4,4,3,5,4,5,3,4,4];

  function holeClass(score, par) {
    const d = score - par;
    if (d <= -2) return 'hole-eagle';
    if (d === -1) return 'hole-birdie';
    if (d === 1) return 'hole-bogey';
    if (d >= 2) return 'hole-double';
    return 'hole-par';
  }

  const rd = TOURNAMENT?.round || '';
  let html = '<div class="scorecard"><div class="scorecard-title">' + (rd ? 'Round ' + rd + ' ' : '') + 'Scorecard &mdash; ' + p.name + '</div>';
  html += '<table><tr style="color:var(--muted);font-weight:600"><td style="text-align:left;padding-left:6px">Hole</td>';
  for (let h = 1; h <= 9; h++) html += '<td>' + h + '</td>';
  html += '<td style="font-weight:800">OUT</td>';
  for (let h = 10; h <= 18; h++) html += '<td>' + h + '</td>';
  html += '<td style="font-weight:800">IN</td><td style="font-weight:800">TOT</td></tr>';
  html += '<tr style="color:var(--muted)"><td style="text-align:left;padding-left:6px;font-weight:600">Par</td>';
  frontPar.forEach(function(v) { html += '<td>' + v + '</td>'; });
  html += '<td style="font-weight:700">' + frontPar.reduce(function(a,b){return a+b;},0) + '</td>';
  backPar.forEach(function(v) { html += '<td>' + v + '</td>'; });
  html += '<td style="font-weight:700">' + backPar.reduce(function(a,b){return a+b;},0) + '</td>';
  html += '<td style="font-weight:700">' + frontPar.concat(backPar).reduce(function(a,b){return a+b;},0) + '</td></tr>';
  html += '<tr><td style="text-align:left;padding-left:6px;font-weight:600">Score</td>';
  front.forEach(function(v,i) { html += '<td class="' + holeClass(v,frontPar[i]) + '">' + v + '</td>'; });
  html += '<td style="font-weight:800">' + front.reduce(function(a,b){return a+b;},0) + '</td>';
  back.forEach(function(v,i) { html += '<td class="' + holeClass(v,backPar[i]) + '">' + v + '</td>'; });
  html += '<td style="font-weight:800">' + back.reduce(function(a,b){return a+b;},0) + '</td>';
  html += '<td style="font-weight:800;color:#1A6B3C">' + p.holes.reduce(function(a,b){return a+b;},0) + '</td></tr></table></div>';
  return html;
}

function isTeetime(thru) {
  if (!thru) return false;
  return /\d{1,2}:\d{2}\s*(AM|PM|am|pm)/i.test(thru);
}

function renderTeeTimes() {
  const withTimes = PLAYERS.filter(function(p) { return p.status === 'active' && isTeetime(p.thru); });
  if (withTimes.length === 0) {
    return '<div style="text-align:center;padding:40px 20px"><div style="font-family:DM Sans,sans-serif;font-size:15px;font-weight:700;color:var(--dim)">No tee times available</div></div>';
  }
  const groups = {};
  withTimes.forEach(function(p) { const t = p.thru.trim(); if (!groups[t]) groups[t] = []; groups[t].push(p); });
  const sortedTimes = Object.keys(groups).sort(function(a, b) {
    const toMin = function(t) { const m = t.match(/(\d{1,2}):(\d{2})\s*(AM|PM)/i); if (!m) return 0; let h = parseInt(m[1]); const min = parseInt(m[2]); const pm = m[3].toUpperCase() === 'PM'; if (pm && h !== 12) h += 12; if (!pm && h === 12) h = 0; return h * 60 + min; };
    return toMin(a) - toMin(b);
  });
  let html = '<div class="search"><input placeholder="Search players..." oninput="lbSearch=this.value;renderApp()" value="' + lbSearch + '"></div>';
  const searchFilter = lbSearch.toLowerCase();
  sortedTimes.forEach(function(time) {
    let players = groups[time];
    if (searchFilter) { players = players.filter(function(p) { return p.name.toLowerCase().includes(searchFilter); }); if (players.length === 0) return; }
    html += '<div style="margin-top:14px;margin-bottom:6px;display:flex;align-items:center;gap:10px"><div style="font-family:DM Sans,sans-serif;font-size:16px;font-weight:800;color:var(--text)">' + time + '</div><div style="flex:1;height:1px;background:var(--border)"></div></div>';
    players.forEach(function(p) {
      html += '<div style="display:flex;align-items:center;padding:10px 12px;background:var(--card);border:1px solid var(--border);border-radius:4px;margin-bottom:4px"><span style="font-size:14px;margin-right:8px">' + p.c + '</span><div style="flex:1"><div style="font-size:14px;font-weight:700;color:var(--text)">' + p.name + '</div></div><div class="lb-total ' + scoreClass(p.score) + '" style="font-size:16px">' + (p.score || '-') + '</div></div>';
    });
  });
  return html;
}

async function fetchTourInsights(tourId, sport) {
  if (insightsCache[tourId] !== undefined) return insightsCache[tourId];
  try {
    const res = await fetch('https://site.api.espn.com/apis/site/v2/sports/' + sport + '/scoreboard');
    if (!res.ok) { insightsCache[tourId] = null; return null; }
    const data = await res.json();
    const evt = data.events?.[0];
    if (!evt) { insightsCache[tourId] = null; return null; }
    const comp = evt.competitions?.[0];
    if (!comp) { insightsCache[tourId] = null; return null; }
    const players = (comp.competitors || []).slice(0, 20);
    if (players.length === 0) { insightsCache[tourId] = null; return null; }
    const status = comp.status || {};
    insightsCache[tourId] = {
      name: evt.shortName || evt.name || '',
      course: comp.venue?.fullName || '',
      round: status.period || 1,
      state: status.type?.state || '',
      stateName: (status.type?.name || '').toUpperCase(),
      statusText: status.type?.description || '',
      players: players.map(function(p) {
        return {
          name: p.athlete?.shortName || p.athlete?.displayName || '?',
          fullName: p.athlete?.displayName || '?',
          score: typeof p.score === 'string' ? p.score : (typeof p.score === 'number' ? (p.score === 0 ? 'E' : p.score > 0 ? '+' + p.score : '' + p.score) : '?'),
          today: p.linescores?.[(status.period || 1) - 1]?.displayValue || '',
          order: p.order || 99,
        };
      }),
    };
    return insightsCache[tourId];
  } catch(e) { insightsCache[tourId] = null; return null; }
}

    function renderPickCard(pick, accentColor, badgeBg) {
      var c = accentColor || 'var(--green)';
      var bg = badgeBg || 'var(--green-fade)';
      var h = '';
      h += '<div style="background:var(--card);border:1px solid var(--border);border-left:4px solid ' + c + ';border-radius:0 4px 4px 0;padding:16px;margin-bottom:8px">';
      h += '<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">';
      h += '<span style="font-size:9px;font-weight:800;letter-spacing:1px;padding:3px 8px;border-radius:2px;color:' + c + ';background:' + bg + '">' + esc(pick.edge_label || '') + '</span>';
      if (pick.units) h += '<span style="font-size:9px;font-weight:700;padding:3px 8px;border-radius:2px;color:var(--gold);background:var(--gold-fade)">' + pick.units + 'u</span>';
      if (pick.sportsbook) h += '<span style="font-size:9px;color:var(--muted)">' + esc(pick.sportsbook) + '</span>';
      h += '</div>';
      if (pick.player_name) {
        h += '<div style="font-family:DM Sans,sans-serif;font-size:18px;font-weight:900;color:var(--text);margin-bottom:4px">' + esc(pick.player_name);
        if (pick.odds) h += ' <span style="color:' + c + '">' + esc(formatOdds(pick.odds)) + '</span>';
        h += '</div>';
      } else if (pick.pick) {
        h += '<div style="font-family:DM Sans,sans-serif;font-size:16px;font-weight:800;color:var(--text);margin-bottom:4px">' + esc(pick.pick);
        if (pick.odds) h += ' <span style="color:' + c + '">' + esc(formatOdds(pick.odds)) + '</span>';
        h += '</div>';
      }
      if (pick.analysis) h += '<div style="font-size:13px;color:var(--dim);line-height:1.7">' + esc(pick.analysis) + '</div>';
      if (pick.confidence) h += '<div style="font-size:10px;color:' + c + ';font-weight:700;margin-top:8px">Confidence: ' + pick.confidence + '/10</div>';
      h += '</div>';
      return h;
    }

    if (_bettingPicks === 'loading') {
      html += '<div style="padding:40px;text-align:center;color:var(--muted);font-style:italic">Loading picks...</div>';
    } else if (!hasPicks) {
      html += '<div style="padding:40px;text-align:center;color:var(--muted);font-style:italic">Picks update daily from live sportsbook odds.</div>';
    } else {

      // ── BEST BET ──
      if (bestBets.length > 0) {
        html += '<div style="font-family:DM Sans,sans-serif;font-size:13px;font-weight:700;color:#fff;letter-spacing:2px;text-transform:uppercase;background:var(--green);padding:8px 12px;border-radius:4px;margin-bottom:8px">TOURFEED BEST BET</div>';
        bestBets.forEach(function(p) { html += renderPickCard(p, 'var(--green)', 'var(--green-fade)'); });
      }

      // ── VALUE PLAYS ──
      if (valuePlays.length > 0) {
        html += '<div style="font-family:DM Sans,sans-serif;font-size:13px;font-weight:700;color:#fff;letter-spacing:2px;text-transform:uppercase;background:var(--green-light);padding:8px 12px;border-radius:4px;margin:16px 0 8px">VALUE PLAYS</div>';
        valuePlays.forEach(function(p) { html += renderPickCard(p, 'var(--green)', 'var(--green-fade)'); });
      }

      // ── LONGSHOT ──
      if (longshots.length > 0) {
        html += '<div style="font-family:DM Sans,sans-serif;font-size:13px;font-weight:700;color:#fff;letter-spacing:2px;text-transform:uppercase;background:#3A6EA5;padding:8px 12px;border-radius:4px;margin:16px 0 8px">LONGSHOT</div>';
        longshots.forEach(function(p) { html += renderPickCard(p, '#3A6EA5', 'rgba(58,110,165,0.08)'); });
      }

      // ── FADE ──
      if (fades.length > 0) {
        html += '<div style="font-family:DM Sans,sans-serif;font-size:13px;font-weight:700;color:#fff;letter-spacing:2px;text-transform:uppercase;background:var(--red,#c0392b);padding:8px 12px;border-radius:4px;margin:16px 0 8px">FADE</div>';
        fades.forEach(function(p) { html += renderPickCard(p, 'var(--red,#c0392b)', 'rgba(192,57,43,0.08)'); });
      }

    } // end hasPicks

    // ── PRE-TOURNAMENT ODDS TABLE ──
    if (!window._realOdds) {
      window._realOdds = 'loading';
      sb.from('player_odds').select('*').order('best_odds', {ascending:true}).limit(15).then(function(res) {
        if (res.data && res.data.length > 0) { window._realOdds = res.data; renderApp(); }
        else { window._realOdds = null; }
      }).catch(function() { window._realOdds = null; });
    }
    if (window._realOdds && window._realOdds !== 'loading' && window._realOdds.length > 0) {
      html += '<div style="font-size:10px;font-weight:800;letter-spacing:2px;color:var(--gold);margin:16px 0 8px">PRE-TOURNAMENT ODDS</div>';
      window._realOdds.slice(0, 10).forEach(function(o, i) {
        var odds = o.best_odds > 0 ? '+' + o.best_odds : '' + o.best_odds;
        html += '<div style="background:var(--card);border:1px solid var(--border);border-radius:4px;padding:10px 14px;margin-bottom:4px;display:flex;align-items:center">';
        html += '<div style="width:24px;font-size:12px;font-weight:700;color:' + (i===0?'var(--gold)':'var(--muted)') + '">' + (i+1) + '</div>';
        html += '<div style="flex:1;min-width:0"><div style="font-size:13px;font-weight:' + (i<3?'800':'600') + ';color:var(--text)">' + o.player_name + '</div>';
        html += '<div style="font-size:9px;color:var(--muted)">Best odds via ' + (o.best_book || 'Sportsbook') + '</div></div>';
        html += '<div style="text-align:right;flex-shrink:0"><div style="font-size:16px;font-weight:900;color:var(--green)">' + odds + '</div>';
        html += '<div style="font-size:9px;color:var(--muted)">' + (o.implied_probability || 0).toFixed(1) + '%</div></div>';
        html += '</div>';
      });
      html += '<div style="font-size:9px;color:var(--muted);margin-top:4px;font-style:italic">Odds via DraftKings, FanDuel, BetMGM &middot; Updated ' + (window._realOdds[0]?.updated_at ? timeAgo(window._realOdds[0].updated_at) : 'recently') + '</div>';
    }

    // Key Storylines
    html += '<div style="font-size:10px;font-weight:800;letter-spacing:2px;color:var(--muted);margin:16px 0 8px">KEY STORYLINES</div>';
    var stories = [
      {title:'Can Rory Defend?',body:'McIlroy won his first green jacket last year to complete the career Grand Slam. Only Tiger, Jack, and Nick Faldo have successfully defended at Augusta in the modern era.'},
      {title:'Scheffler\'s Augusta Record',body:'Two Masters wins (2022, 2024), plus the Open Championship. He is the most dominant player in golf but arrives with a 9-day-old newborn.'},
      {title:'No Tiger, No Phil',body:'First Masters without either since 1994. Tiger is recovering from his March car accident. Mickelson withdrew for family health reasons. End of an era at Augusta.'},
      {title:'LIV at Augusta',body:'Bryson DeChambeau arrives red-hot off consecutive LIV wins. Rahm is a past champion. Ten LIV players in the field. The tour war plays out on the biggest stage.'},
    ];
    stories.forEach(function(s) {
      html += '<div style="background:var(--card);border:1px solid var(--border);border-radius:4px;padding:14px;margin-bottom:6px">';
      html += '<div style="font-family:DM Sans,sans-serif;font-size:14px;font-weight:700;color:var(--text);margin-bottom:4px">' + s.title + '</div>';
      html += '<div style="font-size:12px;color:var(--dim);line-height:1.6">' + s.body + '</div>';
      html += '</div>';
    });
  }

  // DISCLAIMER
  html += '<div class="disclaimer" style="margin-top:16px">All picks are for entertainment purposes only. Past performance does not guarantee future results. Please gamble responsibly. If you or someone you know has a gambling problem, call 1-800-GAMBLER.</div>';
  return html;
}

// ============================================
// RENDER BLOG TAB — same as News but for analysis/preview
// ============================================
// Blog tab removed — all articles now show in News tab

// ============================================
// RENDER STANDINGS
// ============================================
function switchStandingsTour(tour) {
  standingsFilter = tour;
  if (!standingsFetched[tour]) fetchESPNStandings(tour);
  renderApp();
}

function renderStandings() {
  let html = '<div class="filter-bar">';
  ['pga','dpw','lpga','kft','champ'].forEach(function(t) {
    html += '<button class="filter-btn ' + (standingsFilter===t?'active':'') + '" onclick="switchStandingsTour(\'' + t + '\')">' + (TOURS.find(function(x){return x.id===t})?.short||t) + '</button>';
  });
  html += '</div>';

  if (standingsLoading) return html + '<div style="text-align:center;padding:40px 20px"><div style="font-family:DM Sans,sans-serif;font-size:15px;font-weight:700;color:var(--dim)">Loading standings...</div></div>';

  const data = standingsLive[standingsFilter];
  if (!data || data.length === 0) return html + '<div style="text-align:center;padding:40px 20px"><div style="font-size:13px;color:var(--muted)">' + (standingsError || 'FedEx Cup standings update weekly during the PGA Tour season.') + '</div><button class="filter-btn" style="margin-top:14px;color:var(--green);border:1px solid var(--green)" onclick="standingsFetched[\'' + standingsFilter + '\']=false;fetchESPNStandings(\'' + standingsFilter + '\')">Retry</button></div>';

  const tourNames = {pga:'FedExCup',dpw:'Race to Dubai',lpga:'Race to CME Globe',kft:'Korn Ferry Points',champ:'Charles Schwab Cup'};
  html += '<div style="font-family:DM Sans,sans-serif;font-size:18px;font-weight:800;margin-bottom:10px;color:var(--text)">' + (tourNames[standingsFilter] || 'Standings') + '</div>';
  html += '<div class="lb-header"><div style="width:28px">POS</div><div style="flex:1">PLAYER</div><div style="width:56px;text-align:center">PTS</div><div style="width:36px;text-align:center">WINS</div><div style="width:40px;text-align:center">TOP 10</div><div style="width:64px;text-align:right">EARNINGS</div></div>';
  data.forEach(function(r, i) {
    html += '<div class="standings-row ' + (i===0?'top':'') + '"><div style="width:28px;font-size:12px;font-weight:700;color:' + (i===0?'var(--gold)':'var(--muted)') + '">' + r.pos + '</div><div style="flex:1;font-size:13px;font-weight:' + (i===0?800:600) + ';color:' + (i===0?'var(--text)':'var(--dim)') + '">' + r.p + '</div><div style="width:56px;text-align:center;font-size:13px;font-weight:700;color:var(--text)">' + r.pts + '</div><div style="width:36px;text-align:center;font-size:12px;color:' + (r.w>0?'#1A6B3C':'var(--muted)') + ';font-weight:700">' + r.w + '</div><div style="width:40px;text-align:center;font-size:12px;color:var(--muted)">' + r.t10 + '</div><div style="width:64px;text-align:right;font-size:12px;color:var(--gold);font-weight:600">' + r.earn + '</div></div>';
  });
  return html;
}

// ============================================
// RENDER SCHEDULE
// ============================================
let schedFilter = 'all';

function renderSchedule() {
  let html = '<div class="filter-bar">';
  ['all','pga','dpw','lpga'].forEach(function(t) {
    html += '<button class="filter-btn ' + (schedFilter===t?'active':'') + '" onclick="schedFilter=\'' + t + '\';renderApp()">' + (t==='all'?'All':TOURS.find(function(x){return x.id===t})?.short||t) + '</button>';
  });
  html += '</div>';

  if (scheduleLoading) return html + '<div style="text-align:center;padding:40px 20px"><div style="font-family:DM Sans,sans-serif;font-size:15px;font-weight:700;color:var(--dim)">Loading schedule...</div></div>';
  if (scheduleError || scheduleData.length === 0) {
    if (!scheduleFetched) fetchESPNSchedule();
    return html + '<div style="text-align:center;padding:40px 20px"><div style="font-size:13px;color:var(--muted)">' + (scheduleError || 'Loading schedule...') + '</div></div>';
  }

  const filtered = schedFilter === 'all' ? scheduleData : scheduleData.filter(function(s) { return s.tour === schedFilter; });
  if (filtered.length === 0) return html + '<div style="text-align:center;padding:40px 20px;font-size:13px;color:var(--muted)">No events found</div>';

  filtered.forEach(function(s) {
    html += '<div class="sched-card ' + (s.live?'live':'') + '"><div style="display:flex;justify-content:space-between;align-items:flex-start"><div><div style="display:flex;align-items:center;gap:8px"><span style="font-family:DM Sans,sans-serif;font-size:16px;font-weight:800;color:var(--text)">' + s.event + '</span>' + (s.live?'<span class="badge badge-live">LIVE</span>':'') + (s.major?'<span class="badge badge-major">MAJOR</span>':'') + '</div><div style="font-size:12px;color:var(--muted);margin-top:3px">' + s.course + '</div><div style="font-size:11px;color:var(--muted);margin-top:2px">' + s.dates + ' &middot; ' + (TOURS.find(function(x){return x.id===s.tour})?.name||'') + '</div></div><div style="text-align:right">' + (s.purse ? '<div style="font-size:13px;font-weight:700;color:var(--text)">' + s.purse + '</div>' : '') + (s.tv ? '<div style="font-size:10px;color:var(--muted);margin-top:3px">' + s.tv + '</div>' : '') + '</div></div></div>';
  });
  return html;
}

// ============================================
// MAIN RENDER
// ============================================
let _renderTimeout = null;
function renderApp() {
  if (_renderTimeout) clearTimeout(_renderTimeout);
  _renderTimeout = setTimeout(_doRender, 16);
}

function _doRender() {
  var app = document.getElementById('app');
  if (!app) return;
  try {
  var html = '<div style="padding:10px 0">';

  // Update score ticker
  renderScoreTicker();

  // If viewing an article, show it regardless of tab
  if (currentArticle) {
    html += renderArticleDetail(currentArticle);
  } else {
    switch(currentTab) {
      case 0: html += renderHome(); break;
      case 1: html += renderScores(); break;
      case 2: html += renderNews(); break;
      case 3: html += renderInsights(); break;
      case 4: html += renderStandings(); break;
      case 5: html += renderSchedule(); break;
    }
  }

  html += '</div>';
  app.innerHTML = html;

  // Article clicks handled by _articleCache + clickArticle(id)
  } catch(renderErr) { console.error('Render error:', renderErr); app.innerHTML = '<div style="padding:40px;text-align:center;color:var(--muted)">Error rendering page. Please refresh.</div>'; }
}

// ============================================
// INIT
// ============================================
fetchESPNScores(currentScoresTour);
fetchAllArticles();
fetchESPNSchedule();
startAutoRefresh();

// Load betting picks early for Home Quick Picks + Picks tab
if (!_bettingPicks) {
  _bettingPicks = 'loading';
  sb.from('betting_picks').select('*').order('created_at', {ascending:true}).limit(30).then(function(res) {
    if (res.data && res.data.length > 0) { _bettingPicks = res.data; renderApp(); }
    else { _bettingPicks = null; }
  }).catch(function() { _bettingPicks = null; });
}

// URL routing for /article/slug
const pathMatch = window.location.pathname.match(/^\/article\/(.+)/);
if (pathMatch) {
  const slug = decodeURIComponent(pathMatch[1]);
  currentTab = 2;
  (async function() {
    try {
      const { data } = await sb.from('articles').select('*').eq('slug', slug).limit(1);
      if (data?.[0]) {
        currentArticle = data[0];
        renderNav();
        renderApp();
      }
    } catch(e) { console.error('Article load error:', e); }
  })();
}

renderNav();
renderApp();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js').catch(function() {});
}
</script>
</body>
</html>
